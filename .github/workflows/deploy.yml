name: Deploy to Servers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        
    # ---------------------------------------------------------------
    # 改为「Actions 构建一次 → 上传产物」：
    # 原先在 VPS 上 npm run build，小内存机器极易 OOM 失败，
    # 且与 Cloudflare 的构建不是同一份产物。这里复用上一步的 dist。
    # ---------------------------------------------------------------
    - name: Upload dist to Google Cloud
      if: github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
      continue-on-error: true
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.GOOGLE_CLOUD_HOST }}
        username: ${{ secrets.GOOGLE_CLOUD_USER }}
        key: ${{ secrets.GOOGLE_CLOUD_SSH_KEY }}
        source: "dist/**"
        target: "/tmp/shipment-deploy"
        overwrite: true
        rm: true

    - name: Activate on Google Cloud
      if: github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
      continue-on-error: true
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.GOOGLE_CLOUD_HOST }}
        username: ${{ secrets.GOOGLE_CLOUD_USER }}
        key: ${{ secrets.GOOGLE_CLOUD_SSH_KEY }}
        script: |
          set -e
          test -f /tmp/shipment-deploy/dist/index.html || { echo "❌ 产物缺少 index.html"; exit 1; }
          test -f /tmp/shipment-deploy/dist/partner.html || { echo "❌ 产物缺少 partner.html"; exit 1; }
          mkdir -p /var/www/html/assets
          cp -r /tmp/shipment-deploy/dist/* /var/www/html/
          test -f /var/www/html/index.html || { echo "❌ index.html 未落地"; exit 1; }
          test -f /var/www/html/partner.html || { echo "❌ partner.html 未落地"; exit 1; }
          sudo systemctl reload nginx || echo "⚠️ nginx reload 失败（静态文件已更新）"
          echo "✅ Google Cloud 部署完成"
          ls -lh /var/www/html/partner.html
          rm -rf /tmp/shipment-deploy

    - name: Upload dist to Tencent Cloud
      if: github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
      continue-on-error: true
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.TENCENT_CLOUD_HOST }}
        username: ${{ secrets.TENCENT_CLOUD_USER }}
        key: ${{ secrets.TENCENT_CLOUD_SSH_KEY }}
        source: "dist/**"
        target: "/tmp/shipment-deploy"
        overwrite: true
        rm: true

    - name: Activate on Tencent Cloud
      if: github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
      continue-on-error: true
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.TENCENT_CLOUD_HOST }}
        username: ${{ secrets.TENCENT_CLOUD_USER }}
        key: ${{ secrets.TENCENT_CLOUD_SSH_KEY }}
        script: |
          set -e
          test -f /tmp/shipment-deploy/dist/index.html || { echo "❌ 产物缺少 index.html"; exit 1; }
          test -f /tmp/shipment-deploy/dist/partner.html || { echo "❌ 产物缺少 partner.html"; exit 1; }
          mkdir -p /var/www/html/assets
          cp -r /tmp/shipment-deploy/dist/* /var/www/html/
          test -f /var/www/html/index.html || { echo "❌ index.html 未落地"; exit 1; }
          test -f /var/www/html/partner.html || { echo "❌ partner.html 未落地"; exit 1; }
          sudo systemctl reload nginx || echo "⚠️ nginx reload 失败（静态文件已更新）"
          echo "✅ Tencent Cloud 部署完成"
          ls -lh /var/www/html/partner.html
          rm -rf /tmp/shipment-deploy
