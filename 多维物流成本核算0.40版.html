<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多维物流成本与税务 0.40版 · 一般纳税人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body { background: #f4f7fd; color: #1a1a1a; height: 100vh; overflow: hidden; }
        
        .app-container { display: grid; grid-template-columns: 38% 62%; width: 100%; height: 100%; }
        
        .sidebar { background: #ffffff; border-right: 1px solid #e0e6ed; display: flex; flex-direction: column; height: 100%; box-shadow: 2px 0 10px rgba(0,0,0,0.03); z-index: 10; overflow-y: auto; padding: 24px; }
        .sidebar h1 { font-size: 20px; font-weight: 600; color: #0b1a33; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { border: 1px solid #e9eef5; border-radius: 16px; padding: 16px; margin-bottom: 20px; background: #fafcff; }
        .form-group-title { font-size: 15px; font-weight: 600; color: #1f3a6b; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        
        .grid-settings { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-items: center; }
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; color: #3d4d6a; }
        .input-row input[type="number"], .input-row input[type="text"] { width: 85px; padding: 6px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; text-align: center; font-weight: 600; color: #0b1a33; }
        
        .highlight-linked { background-color: #eaf7ee !important; border-color: #a3e0b8 !important; }

        .list-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; background: white; padding: 10px; border-radius: 10px; border: 1px solid #e9eef5; flex-wrap: wrap; }
        .list-row input.name-input { width: 100px; padding: 6px; border: 1px solid #cdd5e0; border-radius: 6px; }
        .list-row input.num-input { width: 65px; padding: 6px; border: 1px solid #cdd5e0; border-radius: 6px; text-align: center; }
        
        .btn-toggle { padding: 6px 12px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; min-width: 85px; }
        .btn-gray { background: #f0f2f5; color: #5a6f8a; }
        .btn-green { background: #eaf7ee; color: #1a7a4a; }
        .btn-blue { background: #e8f3fa; color: #0078D7; }
        .btn-red { background: #fce8e8; color: #d32f2f; }
        .btn-purple { background: #f5eefc; color: #7b2cbf; }
        .btn-stamp { background: #fcf5ee; color: #a6591e; min-width: 90px; }
        .btn-add { width: 100%; padding: 10px; border: 1px dashed #b5c4d6; background: transparent; border-radius: 10px; font-size: 14px; font-weight: 600; color: #5a6f8a; cursor: pointer; margin-top: 5px; }
        .btn-add:hover { background: #f4f7fd; border-color: #0078D7; color: #0078D7; }
        .btn-del { background: transparent; border: none; font-size: 16px; color: #b5c4d6; cursor: pointer; padding: 4px; margin-left: auto; }
        .btn-del:hover { color: #d32f2f; }

        /* 右侧报表区 */
        .report-view { padding: 20px; overflow-y: auto; background: #f4f7fd; display: flex; justify-content: center; }
        .card { max-width: 1100px; width: 100%; background: white; border-radius: 32px; box-shadow: 0 20px 40px -10px rgba(0,20,40,0.1); padding: 28px 30px 32px; height: fit-content; }
        .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 2px solid #e9eef5; padding-bottom: 14px; }
        .card-header h2 { font-size: 22px; font-weight: 600; color: #0b1a33; display: flex; align-items: center; gap: 12px; }
        .order-badge { background: #eef4ff; padding: 6px 18px; border-radius: 60px; font-size: 14px; color: #1d3b6f; font-weight: 500; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .order-badge .tag { background: white; padding: 2px 12px; border-radius: 40px; font-weight: 500; color: #1d3b6f; }
        .split-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 10px 0 20px; }

        .strip-block { margin: 0 0 14px; }
        .strip-head { font-size: 12px; font-weight: 600; color: #6b7c93; margin-bottom: 6px; letter-spacing: 0.4px; }
        .tax-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
            gap: 8px;
        }
        .tax-chip {
            background: #fbf6ef;
            border: 1px solid #ead9c4;
            border-radius: 14px;
            padding: 10px 12px;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .tax-chip.base { background: #f4f8fc; border-color: #d3e0ee; }
        .tax-chip .k { font-size: 12px; color: #7a5a1a; font-weight: 600; letter-spacing: 0.2px; }
        .tax-chip.base .k { color: #1f3a6b; }
        .tax-chip .lines { margin: 6px 0 0; display: flex; flex-direction: column; gap: 3px; }
        .tax-chip .d-cn { font-size: 11px; color: #6b7280; font-weight: 400; margin-top: 4px; line-height: 1.45; }
        .tax-chip .d-num { font-size: 12px; color: #2c2418; font-weight: 500; margin-top: 4px; line-height: 1.45; font-variant-numeric: tabular-nums; word-break: break-word; }
        .tax-chip .line { display: flex; flex-direction: row; justify-content: space-between; align-items: baseline; gap: 8px; }
        .tax-chip .line .nm { font-size: 11px; color: #6b7280; flex: 0 1 auto; white-space: nowrap; }
        .tax-chip .line .num { font-size: 12px; color: #2c2418; font-variant-numeric: tabular-nums; text-align: right; flex: 1 1 auto; min-width: 0; }
        .tax-chip .v {
            font-size: 18px;
            font-weight: 700;
            color: #2c2418;
            font-variant-numeric: tabular-nums;
            margin-top: auto;
            padding-top: 10px;
            text-align: right;
            align-self: stretch;
        }
        .tax-chip.base .v { color: #0b1a33; }
        .tax-chip .v.neg { color: #b45309; }
        .panel { background: #fafcff; border-radius: 20px; padding: 18px 18px 20px; border: 1px solid #e6ecf7; box-shadow: 0 4px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
        .panel-title { font-size: 17px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed #d2ddea; padding-bottom: 10px; flex-shrink: 0; }
        .panel-title .badge { font-size: 12px; background: #dce5f5; padding: 2px 14px; border-radius: 30px; font-weight: 500; color: #1f3a6b; }
        .panel-cash .panel-title { color: #0b3b5c; } .panel-tax .panel-title { color: #7a4a1a; }
        
        .block-positive { background: #eaf7ee; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; border-left: 4px solid #1f8b4a; }
        .block-positive .block-label { font-size: 13px; font-weight: 600; color: #1a6b3a; margin-bottom: 4px; letter-spacing: 0.3px; }
        .block-negative { background: #f7eeee; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; border-left: 4px solid #b13e3e; }
        .block-negative .block-label { font-size: 13px; font-weight: 600; color: #8a2e2e; margin-bottom: 4px; letter-spacing: 0.3px; }
        .block-tax { background: #f7f0e8; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; border-left: 4px solid #b88a3e; }
        .block-tax .block-label { font-size: 13px; font-weight: 600; color: #7a5a1a; margin-bottom: 4px; letter-spacing: 0.3px; }
        
        .block-result { background: #e8eefa; border-radius: 14px; padding: 10px 14px; border-left: 4px solid #2b6bb0; margin-top: auto; }
        .block-result .block-label { font-size: 13px; font-weight: 600; color: #1f3d66; margin-bottom: 4px; letter-spacing: 0.3px; }
        
        .row-item { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14.5px; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .row-item:last-of-type { border-bottom: none; }
        .row-label { color: #3d4d6a; font-weight: 400; flex: 0 0 auto; min-width: 90px; }
        .row-detail { color: #6b7280; font-size: 13px; font-weight: 400; flex: 1 1 auto; text-align: center; padding: 0 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.35; }
        .f-cn { font-size: 11px; color: #6b7280; font-weight: 400; }
        .f-num { font-size: 12px; color: #3d4d6a; font-weight: 500; font-variant-numeric: tabular-nums; }
        .row-value { font-weight: 400; font-variant-numeric: tabular-nums; flex: 0 0 auto; min-width: 70px; text-align: right; color: #3d4d6a; }
        .row-value.big { font-size: 17px; font-weight: 700; }
        
        .row-value.positive { color: #1a7a4a; }
        .row-value.negative { color: #d32f2f !important; }
        .row-value.green { color: #1b7b44; }

        /* 拆项：灰黑、不加粗 */
        .row-line, .sub-row { padding-left: 20px; font-size: 13.5px; color: #3d4d6a; border-left: 2px solid #d0ddea; margin-left: 4px; font-weight: 400; }
        .row-line .row-label, .sub-row .row-label { font-weight: 400; color: #3d4d6a; min-width: 80px; }
        .row-line .row-value, .sub-row .row-value,
        .row-line .row-value.positive, .sub-row .row-value.positive,
        .row-line .row-value.negative, .sub-row .row-value.negative,
        .row-line .row-value.sub-val, .sub-row .row-value.sub-val {
            color: #3d4d6a !important;
            font-weight: 400 !important;
            font-size: 13.5px !important;
        }

        /* 分项合计：比总合计小一号 */
        .row-subtotal { font-size: 13.5px; }
        .row-subtotal .row-label { font-weight: 600; font-size: 13.5px; }
        .row-subtotal .row-value {
            font-weight: 600 !important;
            font-size: 14px !important;
        }
        .row-subtotal .row-value.positive { color: #1a7a4a !important; }
        .row-subtotal .row-value.negative { color: #d32f2f !important; }
        .row-subtotal .row-value.total-tax { color: #a6591e !important; }

        /* 总项合计 */
        .row-total { font-size: 14.5px; }
        .row-total .row-label { font-weight: 600; color: #0b1a33; }
        .row-total .row-value { font-weight: 700 !important; font-size: 15px !important; }
        .row-total .row-value.positive { color: #1a7a4a !important; }
        .row-total .row-value.negative { color: #d32f2f !important; }
        .row-total .row-value.total-tax { color: #a6591e !important; }
        .row-total .row-value.green { color: #1b7b44 !important; }
        .row-total .row-value.big { font-size: 17px !important; }

        .hl-bold { font-weight: 600; color: #0b1a33; }

        .border-top-thin { border-top: 1px solid #dbb8b8; margin: 4px 0 2px; }
        .border-top-tax { border-top: 1px solid #dbb89e; margin: 4px 0 2px; }

        .result-area { background: #f0f5fe; border-radius: 18px; padding: 16px 22px; margin: 18px 0 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; border-left: 6px solid #2b6bb0; }
        .result-item { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .result-item .label { font-size: 15px; color: #1f3d66; font-weight: 500; }
        .result-item .number { font-size: 22px; font-weight: 700; color: #0b2b50; letter-spacing: -0.2px; }
        .result-item .number.green { color: #1b7b44; }
        .result-item .number.red { color: #d32f2f; }
        .check-mark { padding: 6px 18px; border-radius: 60px; font-size: 14px; font-weight: 500; }
        .check-mark.success { background: #d3e6d6; color: #0d4823; }
        .check-mark.error { background: #fce8e8; color: #d32f2f; }
        
        .footnote { margin-top: 20px; font-size: 13px; color: #5b6f8e; background: #f4f8ff; padding: 12px 20px; border-radius: 40px; display: flex; flex-wrap: wrap; gap: 8px 24px; border: 1px solid #e0e9f5; }
        .footnote span { font-weight: 500; color: #1f3b61; }

        @media (max-width: 900px) {
            body { height: auto; overflow: visible; }
            .app-container { display: flex; flex-direction: column; }
            .sidebar { border-right: none; border-bottom: 2px solid #e0e6ed; padding: 16px; overflow: visible; box-shadow: none; }
            .report-view { padding: 12px; overflow: visible; }
            .card { padding: 20px 16px; border-radius: 24px; }
            .split-panel { grid-template-columns: 1fr; gap: 20px; }
            .tax-strip { grid-template-columns: repeat(2, 1fr); }
            .grid-settings { grid-template-columns: 1fr; gap: 10px; }
            .input-row { width: 100%; }
            .list-row { gap: 8px; justify-content: space-between; }
            .list-row input.name-input { flex-grow: 1; min-width: 80px; width: auto; }
            .btn-toggle { flex-grow: 1; min-width: unset; padding: 8px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar" id="sidebar">
        <h1>⚙️ 成本与税务引擎 · 一般纳税人</h1>
        
        <div class="form-group">
            <div class="form-group-title">🎛 全局配置</div>
            <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; align-items: center;">
                <button class="btn-toggle btn-gray" id="btnPlatform" onclick="togglePlatform()" style="flex: 1; white-space: nowrap;">⬜ 关闭代扣代缴模式</button>
                <div class="input-row highlight-linked" id="wrapPlatRate" style="flex: 1; display: none;">
                    <span>代扣税率:</span><input type="number" id="platRate" value="0.075" step="0.005" oninput="syncPlatRate(this.value)" title="金额栏请填司机净价，系统还原含税实付">
                </div>
                <div class="input-row highlight-linked" style="flex: 1;">
                    <span title="主营开票销项税率；代扣代缴拆进项也用此税率">上游税点:</span><input type="number" id="upstreamRate" value="0.09" step="0.01" oninput="syncUpstreamRate(this.value)" title="主营开票销项税率；代扣代缴拆进项也用此税率">
                </div>
            </div>
            <div class="grid-settings">
                <div class="input-row"><span>业务倍数:</span><input type="number" id="qty" value="1" oninput="render()"></div>
                <div class="input-row"><span>附加税率:</span><input type="number" id="surchargeRate" value="0.06" step="0.01" oninput="render()"></div>
                <div class="input-row"><span title="按你的实际税负填写，参与测算">所得税率:</span><input type="number" id="incomeRate" value="0.05" step="0.01" oninput="render()" title="按你的实际税负填写，参与测算"></div>
                <div class="input-row"><span>印花税率:</span><input type="number" id="stampRate" value="0.0003" step="0.0001" oninput="render()"></div>
            </div>
        </div>

        <div class="form-group">
            <div class="form-group-title"><span>💰 营业收入项</span></div>
            <div id="revContainer"></div>
            <button class="btn-add" onclick="addRevRow()">➕ 添加收入项</button>
        </div>

        <div class="form-group">
            <div class="form-group-title">
                <span>💸 运营支出项</span>
                <button onclick="showBreakeven(event)" style="background: #eaf7ee; color: #1a7a4a; border: 1px solid #cde8d5; padding: 4px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;">
                    ⚖️ 保本测算
                </button>
            </div>
            <div id="costContainer"></div>
            <button class="btn-add" onclick="addCostRow()">➕ 添加支出项</button>
        </div>
    </div>

    <div class="report-view" id="reportView"></div>
</div>

<script>
    let state = {
        usePlatform: false,
        revs: [ { id: 1, name: "主营结算", amt: 55, rate: 0.09, inc: true, stamp: true } ],
        costs: [
            { id: 1, name: "外包运费", amt: 40, rate: 0.01, ticket: 1, stamp: true },
            { id: 2, name: "居间服务", amt: 10, rate: 0.01, ticket: 2, stamp: true }
        ],
        nextId: 10
    };

    function dRound(num) {
        return Math.round((parseFloat(num) + Number.EPSILON) * 100) / 100;
    }

    // 应缴增值税与未抵扣进项：销项不够抵时差额转入成本，不退税
    function vatSettle(outVat, inVat) {
        return {
            payVat: dRound(Math.max(0, outVat - inVat)),
            unusedVat: dRound(Math.max(0, inVat - outVat))
        };
    }

    // 按税率把含税拆成不含税和税额
    function vatSplit(cash, rate) {
        cash = dRound(cash);
        if (rate > 0) {
            let excl = dRound(cash / (1 + rate));
            return { excl: excl, vat: dRound(cash - excl) };
        }
        return { excl: cash, vat: 0 };
    }

    function splitRev(r, qty) {
        let amt = r.amt * qty;
        let cash, excl, outVat;
        if (r.inc) {
            cash = dRound(amt);
            let split = vatSplit(cash, r.rate);
            excl = split.excl;
            outVat = split.vat;
        } else {
            excl = dRound(amt);
            outVat = dRound(excl * r.rate);
            cash = dRound(excl + outVat);
        }
        return { cash: cash, excl: excl, outVat: outVat };
    }

    // 代扣进项按上游税点拆；普票不能抵进项，但印花税按不含税价款
    function splitCost(c, qty, pRate, upRate) {
        if (c.ticket === 3) {
            let net = dRound(c.amt * qty);
            let cash = (pRate > 0 && pRate < 1) ? dRound(net / (1 - pRate)) : net;
            let split = vatSplit(cash, upRate);
            return { cash: cash, excl: split.excl, inVat: split.vat, costDeduct: split.excl, taxDeduct: split.excl, stampExcl: split.excl };
        }
        let cash = dRound(c.amt * qty);
        if (c.ticket === 2) {
            let split = vatSplit(cash, c.rate);
            return { cash: cash, excl: split.excl, inVat: split.vat, costDeduct: split.excl, taxDeduct: split.excl, stampExcl: split.excl };
        }
        if (c.ticket === 1) {
            let split = vatSplit(cash, c.rate);
            return { cash: cash, excl: split.excl, inVat: 0, costDeduct: cash, taxDeduct: cash, stampExcl: split.excl };
        }
        return { cash: cash, excl: cash, inVat: 0, costDeduct: cash, taxDeduct: 0, stampExcl: cash };
    }

    function dual(cn, num) {
        return `<span class="f-cn">${cn}</span><span class="f-num">${num}</span>`;
    }

    function chipHtml(kind, title, cnText, numText, value, neg, items) {
        let lineHtml = '';
        if (items && items.length) {
            lineHtml = `<div class="lines">${items.map(it =>
                `<div class="line"><span class="nm">${it.name}</span><span class="num">${it.num}</span></div>`
            ).join('')}</div>`;
        }
        // 分项已经写出数字公式时，不再追加一行重复合计；带乘税率的（如印花税）仍保留
        let showNum = numText;
        if (showNum && items && items.length) {
            let compact = showNum.replace(/\s/g, '');
            let val = String(value).replace(/\s/g, '');
            let hasRate = /[×%]/.test(showNum);
            if (!hasRate && (compact === val || compact.endsWith('＝' + val))) {
                showNum = '';
            }
        }
        let dCn = cnText ? `<div class="d-cn">${cnText}</div>` : '';
        let dNum = showNum ? `<div class="d-num">${showNum}</div>` : '';
        return `<div class="tax-chip ${kind}">
                        <div class="k">${title}</div>
                        ${dCn}${lineHtml}${dNum}
                        <div class="v${neg ? ' neg' : ''}">${value}</div>
                    </div>`;
    }
    
    function getVal(id) { return parseFloat(document.getElementById(id).value) || 0; }

    function getQty() {
        let el = document.getElementById('qty');
        if (!el || el.value === '' || el.value === null) return 1;
        let n = parseFloat(el.value);
        if (isNaN(n) || n < 0) return 1;
        return n;
    }
    
    function syncUpstreamRate(val) {
        let rate = parseFloat(val) || 0;
        // 只同步第一项「含税开票」收入；不开票项税率必须保持 0，否则会误计销项
        if (state.revs.length > 0 && state.revs[0].inc) { state.revs[0].rate = rate; }
        buildForms(); render();
    }

    function syncPlatRate(val) {
        let rate = parseFloat(val) || 0;
        state.costs.forEach(c => {
            if (c.ticket === 3) {
                c.rate = rate;
            }
        });
        buildForms(); render();
    }

    function updateVal(type, id, field, val) {
        let arr = type === 'rev' ? state.revs : state.costs;
        let item = arr.find(x => x.id === id);
        item[field] = field === 'name' ? val : parseFloat(val) || 0;
        
        if (type === 'rev' && field === 'rate' && state.revs.length > 0 && id === state.revs[0].id) {
            document.getElementById('upstreamRate').value = item.rate;
        }
        render();
    }

    function togglePlatform() {
        state.usePlatform = !state.usePlatform;
        const btn = document.getElementById('btnPlatform');
        const wrap = document.getElementById('wrapPlatRate');
        
        if (state.usePlatform) {
            btn.className = 'btn-toggle btn-purple';
            btn.innerHTML = '✅ 启用代扣代缴模式';
            wrap.style.display = 'flex';
            
            if (state.costs.length > 0) {
                state.costs[0].ticket = 3;
                state.costs[0].rate = getVal('platRate') || 0.075;
            }
        } else {
            btn.className = 'btn-toggle btn-gray';
            btn.innerHTML = '⬜ 关闭代扣代缴模式';
            wrap.style.display = 'none';
            
            state.costs.forEach(c => { if(c.ticket === 3) { c.ticket = 1; c.rate = 0.01; } });
        }
        buildForms();
        render();
    }

    function toggleRevInc(id) {
        let r = state.revs.find(x => x.id === id);
        r.inc = !r.inc;
        r.rate = r.inc ? getVal('upstreamRate') : 0;
        buildForms(); render();
    }
    
    function toggleStamp(type, id) {
        let arr = type === 'rev' ? state.revs : state.costs;
        let item = arr.find(x => x.id === id);
        item.stamp = !item.stamp;
        buildForms(); render();
    }

    function toggleCostTicket(id) {
        let c = state.costs.find(x => x.id === id);
        let maxState = state.usePlatform ? 4 : 3;
        c.ticket = (c.ticket + 1) % maxState;
        
        if(c.ticket === 0) c.rate = 0;
        else if(c.ticket === 1) c.rate = 0.01;
        else if(c.ticket === 2) c.rate = 0.09;
        else if(c.ticket === 3) c.rate = getVal('platRate') || 0.075;
        
        buildForms(); render();
    }

    function addRevRow() {
        let upRate = getVal('upstreamRate') || 0.09;
        state.revs.push({ id: state.nextId++, name: "新增收入", amt: 0, rate: upRate, inc: true, stamp: true });
        buildForms(); render();
    }
    
    function addCostRow() {
        state.costs.push({ id: state.nextId++, name: "新增支出", amt: 0, rate: 0.01, ticket: 1, stamp: true });
        buildForms(); render();
    }
    
    function delRow(type, id) {
        if(type === 'rev') state.revs = state.revs.filter(x => x.id !== id);
        else state.costs = state.costs.filter(x => x.id !== id);
        buildForms(); render();
    }

    function reverseCalcCost(id) {
        let c = state.costs.find(x => x.id === id);
        if (!c) return;
        if (c.ticket === 3) {
            let pRate = getVal('platRate');
            let upRate = getVal('upstreamRate');
            let raw = prompt(`【代扣倒推】\n当前支出项：${c.name}\n\n请输入司机要求的【净到手现金】：`, c.amt);
            if (raw === null || raw === '' || isNaN(raw)) return;
            let net = parseFloat(raw);
            if (pRate < 0 || pRate >= 1) {
                alert('代扣税率必须在 0 到 1 之间');
                return;
            }
            let gross = dRound(net / (1 - pRate));
            let excl = vatSplit(gross, upRate).excl;
            if (confirm(`净到手 ${dRound(net).toFixed(2)} 元\n含税实付 ${gross.toFixed(2)} ＝ 净到手 ÷（1 − 代扣税率 ${(pRate*100).toFixed(2)}%）\n按上游税点 ${(upRate*100).toFixed(0)}% 拆进项，不含税 ${excl.toFixed(2)} 元\n\n金额栏填入净价 ${dRound(net).toFixed(2)} 元？`)) {
                updateVal('cost', id, 'amt', dRound(net));
                buildForms();
            }
            return;
        }
        let raw = prompt(`【倒推含税支出】\n当前支出项：${c.name}\n\n请输入不含税金额，系统按该项税率还原含税支出：`, c.amt);
        if (raw === null || raw === '' || isNaN(raw)) return;
        let excl = parseFloat(raw);
        let rate = c.ticket === 0 ? 0 : (c.rate || 0);
        let gross = rate > 0 ? dRound(excl * (1 + rate)) : dRound(excl);
        if (confirm(`不含税 ${dRound(excl).toFixed(2)} 元\n含税支出 ${gross.toFixed(2)} ＝ 不含税 ×（1＋税率 ${(rate*100).toFixed(0)}%）\n\n是否填入含税支出？`)) {
            updateVal('cost', id, 'amt', gross);
            buildForms();
        }
    }

    function getBreakevenRev() {
        let qty = getQty();
        let surRate = getVal('surchargeRate');
        let incRate = getVal('incomeRate');
        let stampRate = getVal('stampRate');
        let upRate = getVal('upstreamRate') || 0;
        let pRate = getVal('platRate');

        let inVat = 0, taxDeduct = 0, stampBaseCost = 0, cashCost = 0;
        state.costs.forEach(c => {
            let s = splitCost(c, qty, pRate, upRate);
            cashCost += s.cash;
            taxDeduct += s.taxDeduct;
            inVat += s.inVat;
            if (c.stamp) stampBaseCost += s.stampExcl;
        });
        cashCost = dRound(cashCost);
        taxDeduct = dRound(taxDeduct);
        inVat = dRound(inVat);
        stampBaseCost = dRound(stampBaseCost);

        let otherCash = 0, otherExcl = 0, otherOut = 0, otherStamp = 0;
        state.revs.slice(1).forEach(r => {
            let s = splitRev(r, qty);
            otherCash += s.cash;
            otherExcl += s.excl;
            otherOut += s.outVat;
            if (r.stamp) otherStamp += s.excl;
        });
        otherCash = dRound(otherCash);
        otherExcl = dRound(otherExcl);
        otherOut = dRound(otherOut);
        otherStamp = dRound(otherStamp);
        let mainStamp = state.revs.length > 0 && state.revs[0].stamp;

        if (cashCost === 0 && otherCash === 0) return { noInvoice: 0, withInvoice: 0, rate: upRate };

        function findMinRev(invoiceRate) {
            let lowCents = Math.max(0, Math.floor((cashCost - otherCash) * 100) - 500);
            let highCents = Math.ceil((cashCost + Math.abs(otherCash) + 1) * 300);
            let bestCents = highCents;

            while (lowCents <= highCents) {
                let midCents = Math.floor((lowCents + highCents) / 2);
                let R = midCents / 100;
                let r_excl, out_vat;
                if (invoiceRate > 0) {
                    r_excl = dRound(R / (1 + invoiceRate));
                    out_vat = dRound(R - r_excl);
                } else {
                    r_excl = dRound(R);
                    out_vat = 0;
                }
                let vat = vatSettle(dRound(out_vat + otherOut), inVat);
                let payVat = vat.payVat;
                let deduct = dRound(taxDeduct + vat.unusedVat);
                let sur = dRound(payVat * surRate);
                let stampRev = dRound((mainStamp ? r_excl : 0) + otherStamp);
                let stamp = dRound((stampBaseCost + stampRev) * stampRate);
                let taxableInc = dRound(r_excl + otherExcl - deduct - sur - stamp);
                let incTax = dRound(Math.max(0, taxableInc * incRate));
                let totalTax = dRound(payVat + sur + stamp + incTax);
                let netProfit = dRound(dRound(R + otherCash - cashCost) - totalTax);

                if (netProfit >= 0) {
                    bestCents = midCents;
                    highCents = midCents - 1;
                } else {
                    lowCents = midCents + 1;
                }
            }
            return bestCents / 100;
        }

        return {
            noInvoice: findMinRev(0),
            withInvoice: findMinRev(upRate),
            rate: upRate
        };
    }

    function showBreakeven(e) {
        let res = getBreakevenRev();
        let tip = document.getElementById('be-tip');
        if(!tip) {
            tip = document.createElement('div');
            tip.id = 'be-tip';
            e.target.style.position = 'relative';
            e.target.appendChild(tip);
        }
        tip.style.cssText = "position:absolute; background:#1a2b4c; color:white; padding:12px 18px; border-radius:10px; font-size:14px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,0.25); transform:translateY(-110%); left:50%; margin-left:-160px; z-index:999; pointer-events:none; white-space:nowrap; opacity:0; transition: opacity 0.2s; line-height:1.7; text-align:left;";
        let invExcl = res.rate > 0 ? dRound(res.withInvoice / (1 + res.rate)) : res.withInvoice;
        let qty = getQty();
        let qtyNote = '';
        if (qty > 0 && qty !== 1) {
            qtyNote = `<br><span style="font-size:12px; color:#94a3b8; font-weight:400;">以上为 ${qty} 倍合计 · 单价不开票 ${dRound(res.noInvoice / qty).toFixed(2)} / 开票含税 ${dRound(res.withInvoice / qty).toFixed(2)}</span>`;
        } else if (qty === 0) {
            qtyNote = `<br><span style="font-size:12px; color:#94a3b8; font-weight:400;">业务倍数为 0，不测算单价</span>`;
        }
        let extra = state.revs.length > 1 ? `<br><span style="font-size:12px; color:#94a3b8; font-weight:400;">针对第一项收入保本，其余 ${state.revs.length - 1} 项收入已计入</span>` : '';
        tip.innerHTML = `⚖️ 保本测算<br>`
            + `<span style="color:#cbd5e1; font-weight:400;">货主不开票付给你</span> <span style="color:#4ade80; font-size:17px; font-weight:700;">${res.noInvoice.toFixed(2)}</span> 元<br>`
            + `<span style="color:#cbd5e1; font-weight:400;">向货主开票含税</span> <span style="color:#4ade80; font-size:17px; font-weight:700;">${res.withInvoice.toFixed(2)}</span> 元<br>`
            + `<span style="font-size:12px; color:#94a3b8; font-weight:400;">开票不含税货款 ${invExcl.toFixed(2)} 元 ＝ 开票含税 ÷（1＋上游税点 ${Math.round(res.rate * 100)}%）</span>${qtyNote}${extra}`;
        tip.style.opacity = '1';
        setTimeout(() => { if(tip) tip.style.opacity = '0'; }, 4000);
    }

        let revHtml = '';

            let incClass = r.inc ? "btn-green" : "btn-gray";
            let incText = r.inc ? "✅ 含税" : "⬜ 不含税";
            let stpClass = r.stamp ? "btn-stamp" : "btn-gray";
            let stpText = r.stamp ? "📄 计印花税" : "🚫 免印花税";

                <div class="list-row">

            else { tClass = "btn-purple"; tText = "🏢 代扣"; }

                    <button class="btn-toggle ${tClass}" onclick="toggleCostTicket(${c.id})">${tText}</button>
                    <button class="btn-toggle ${stpClass}" onclick="toggleStamp('cost', ${c.id})">${stpText}</button>
                    <button class="btn-del" onclick="delRow('cost', ${c.id})">✖</button>

    function render() {
        let qty = getQty();
        let pRate = getVal('platRate');
        let surRate = getVal('surchargeRate');
        let incRate = getVal('incomeRate');
        let stampRate = getVal('stampRate');
        let upRate = getVal('upstreamRate');

        let totals = {
            cashRev: 0, revExcl: 0, outVat: 0,
            cashCost: 0, costExcl: 0, taxDeduct: 0, inVat: 0,
            stampBase: 0,
            revsHtml: '', revExclHtml: '',
            costHtml: '', costExclHtml: '',
            revCashNums: [], revExclNums: [], costCashNums: [], costExclNums: [],
            revExclItems: [], outVatItems: [], costExclItems: [], inVatItems: [],
            stampItems: [], taxDeductItems: []
        };

        state.revs.forEach(r => {
            let s = splitRev(r, qty);
            let cash = s.cash, excl = s.excl, outVat = s.outVat;
            totals.cashRev += cash;
            totals.revExcl += excl;
            totals.outVat += outVat;
            if(r.stamp) {
                totals.stampBase += excl;
                totals.stampItems.push({ name: r.name, num: excl.toFixed(2) });
            }

            totals.revCashNums.push(cash.toFixed(2));
            totals.revExclNums.push(excl.toFixed(2));
            totals.revExclItems.push(r.inc && r.rate > 0
                ? { name: r.name, num: `${cash.toFixed(2)} ÷ ${ (1 + r.rate).toFixed(2) } ＝ ${excl.toFixed(2)}` }
                : { name: r.name, num: cash.toFixed(2) });
            totals.outVatItems.push(r.rate > 0
                ? { name: r.name, num: `${cash.toFixed(2)} − ${excl.toFixed(2)} ＝ ${outVat.toFixed(2)}` }
                : { name: r.name, num: '0.00' });

            totals.revsHtml += `
                <div class="row-item sub-row">
                    <span class="row-label">📥 ${r.name}</span>
                    <span class="row-detail">${r.inc ? '含税开票实收' : '不开票实收'}</span>
                    <span class="row-value positive">+${cash.toFixed(2)}</span>
                </div>`;
            totals.revExclHtml += `
                <div class="row-item sub-row">
                    <span class="row-label">${r.name}不含税</span>
                    <span class="row-detail">${r.inc && r.rate > 0
                        ? dual('含税收入 ÷（1＋销项税率）', `${cash.toFixed(2)} ÷ ${(1 + r.rate).toFixed(2)}`)
                        : dual('不含税等于实收', cash.toFixed(2))}</span>
                    <span class="row-value sub-val">${excl.toFixed(2)}</span>
                </div>`;
        });

        state.costs.forEach(c => {
            let s = splitCost(c, qty, pRate, upRate);
            let cash = s.cash, excl = s.excl, inVat = s.inVat, costDeduct = s.costDeduct, taxDeduct = s.taxDeduct;
            let ticketStr = "含税 · 专票";
            
            if(c.ticket === 3) {
                totals.costHtml += `
                    <div class="row-item sub-row">
                        <span class="row-label">🚛 ${c.name}</span>
                        <span class="row-detail">${dual('金额栏为净价，还原含税实付', cash.toFixed(2))}</span>
                        <span class="row-value negative">−${cash.toFixed(2)}</span>
                    </div>
                    <div class="row-item sub-row">
                        <span class="row-label">代扣还原</span>
                        <span class="row-detail">${dual('净价 ÷（1 − 代扣税率）', `${dRound(c.amt * qty).toFixed(2)} ÷ ${(1 - pRate).toFixed(3)}`)}</span>
                        <span class="row-value sub-val">${cash.toFixed(2)}</span>
                    </div>`;
            } else {
                if(c.ticket === 2) {
                    ticketStr = "含税 · 专票";
                } else if (c.ticket === 1) {
                    ticketStr = "含税 · 普票";
                } else {
                    ticketStr = "无票支出";
                }
                totals.costHtml += `
                    <div class="row-item sub-row">
                        <span class="row-label">🤝 ${c.name}</span>
                        <span class="row-detail">${ticketStr}</span>
                        <span class="row-value negative">−${cash.toFixed(2)}</span>
                    </div>`;
            }

            totals.cashCost += cash;
            totals.costExcl += costDeduct;
            totals.inVat += inVat;
            totals.taxDeduct += taxDeduct;
            if(c.stamp) {
                totals.stampBase += s.stampExcl;
                totals.stampItems.push({ name: c.name, num: s.stampExcl.toFixed(2) });
            }

            let costCn, costNum;
            if (c.ticket === 3) {
                costCn = '含税实付 ÷（1＋上游税点）';
                costNum = `${cash.toFixed(2)} ÷ ${(1 + upRate).toFixed(2)} ＝ ${costDeduct.toFixed(2)}`;
            } else if (inVat > 0 && c.rate > 0) {
                costCn = '含税支出 ÷（1＋进项税率）';
                costNum = `${cash.toFixed(2)} ÷ ${(1 + c.rate).toFixed(2)} ＝ ${costDeduct.toFixed(2)}`;
            } else {
                costCn = c.ticket === 1 ? '普票无进项，不含税成本等于含税支出' : '没票无进项，不含税成本等于含税支出';
                costNum = cash.toFixed(2);
            }
            totals.costExclHtml += `
                <div class="row-item sub-row">
                    <span class="row-label">${c.name}不含税成本</span>
                    <span class="row-detail">${dual(costCn, costNum)}</span>
                    <span class="row-value sub-val">${costDeduct.toFixed(2)}</span>
                </div>`;
            totals.costCashNums.push(cash.toFixed(2));
            totals.costExclNums.push(costDeduct.toFixed(2));
            totals.costExclItems.push({ name: c.name, num: costNum });
            totals.inVatItems.push(inVat > 0
                ? { name: c.name, num: `${cash.toFixed(2)} − ${excl.toFixed(2)} ＝ ${inVat.toFixed(2)}` }
                : { name: c.name, num: '0.00' });
            if (taxDeduct > 0) {
                totals.taxDeductItems.push({
                    name: c.name,
                    num: (c.ticket === 2 || c.ticket === 3) ? excl.toFixed(2) : cash.toFixed(2)
                });
            }
        });

        totals.cashRev = dRound(totals.cashRev); totals.revExcl = dRound(totals.revExcl); totals.outVat = dRound(totals.outVat);
        totals.cashCost = dRound(totals.cashCost); totals.costExcl = dRound(totals.costExcl); totals.taxDeduct = dRound(totals.taxDeduct);
        totals.inVat = dRound(totals.inVat); totals.stampBase = dRound(totals.stampBase);

        // 销项不够抵进项时：未抵扣进项转入成本（不能当成利润）
        let vat = vatSettle(totals.outVat, totals.inVat);
        let unusedVat = vat.unusedVat;
        let payVat = vat.payVat;
        if (unusedVat > 0) {
            totals.taxDeduct = dRound(totals.taxDeduct + unusedVat);
            totals.costExcl = dRound(totals.costExcl + unusedVat);
            totals.costExclNums.push(unusedVat.toFixed(2));
            totals.costExclItems.push({ name: '未抵扣进项', num: `${totals.inVat.toFixed(2)} − ${totals.outVat.toFixed(2)} ＝ ${unusedVat.toFixed(2)}` });
            totals.taxDeductItems.push({ name: '未抵扣进项', num: unusedVat.toFixed(2) });
            totals.costExclHtml += `
                <div class="row-item sub-row">
                    <span class="row-label">未抵扣进项转入成本</span>
                    <span class="row-detail">${dual('进项税额 − 销项税额，单趟用不掉计入成本', `${totals.inVat.toFixed(2)} − ${totals.outVat.toFixed(2)}`)}</span>
                    <span class="row-value sub-val">${unusedVat.toFixed(2)}</span>
                </div>`;
        }
        let sur = dRound(payVat * surRate);
        let stamp = dRound(totals.stampBase * stampRate);
        let taxableInc = dRound(totals.revExcl - totals.taxDeduct - sur - stamp);
        let incTax = dRound(Math.max(0, taxableInc * incRate));
        let totalTax = dRound(payVat + sur + stamp + incTax);
        let otherTax = dRound(sur + stamp + incTax);

        let cashMargin = dRound(totals.cashRev - totals.cashCost);
        let netProfit = dRound(cashMargin - totalTax);
        let f2Profit = dRound(totals.revExcl - totals.costExcl - otherTax);
        let compTaxRate = totals.cashRev > 0 ? ((totalTax / totals.cashRev) * 100).toFixed(2) : "0.00";
        let costExclNum = totals.costExclNums.join(' ＋ ') || '0.00';
        let revCashNum = totals.revCashNums.join(' ＋ ') || '0.00';
        let revExclNum = totals.revExclNums.join(' ＋ ') || '0.00';
        let costCashNum = totals.costCashNums.join(' ＋ ') || '0.00';
        let stampNum = totals.stampItems.length
            ? `${totals.stampItems.map(it => it.num).join(' ＋ ')} ＝ ${totals.stampBase.toFixed(2)}，× ${(stampRate * 100).toFixed(2)}% ＝ ${stamp.toFixed(2)}`
            : '0.00';
        let otherTaxNum = `${sur.toFixed(2)} ＋ ${stamp.toFixed(2)} ＋ ${incTax.toFixed(2)}`;
        let totalTaxNum = `${payVat.toFixed(2)} ＋ ${sur.toFixed(2)} ＋ ${stamp.toFixed(2)} ＋ ${incTax.toFixed(2)}`;
        let cashMarginNum = `${totals.cashRev.toFixed(2)} − ${totals.cashCost.toFixed(2)}`;
        let cashProfitNum = `${cashMargin.toFixed(2)} − ${totalTax.toFixed(2)}`;
        let pnlProfitNum = `${totals.revExcl.toFixed(2)} − ${totals.costExcl.toFixed(2)} − ${otherTax.toFixed(2)}`;
        let deductDiffers = Math.abs(totals.taxDeduct - totals.costExcl) >= 0.01;
        let incCn = deductDiffers
            ? '不含税收入 − 税前扣除 − 附加税 − 印花税，再 × 所得税率；没票不能扣，亏损不征'
            : '不含税收入 − 不含税成本 − 附加税 − 印花税，再 × 所得税率；亏损不征';
        let incBase = deductDiffers ? totals.taxDeduct : totals.costExcl;
        let incNum = taxableInc > 0
            ? `${totals.revExcl.toFixed(2)} − ${incBase.toFixed(2)} − ${sur.toFixed(2)} − ${stamp.toFixed(2)} ＝ ${taxableInc.toFixed(2)}，× ${(incRate * 100).toFixed(0)}% ＝ ${incTax.toFixed(2)}`
            : `${totals.revExcl.toFixed(2)} − ${incBase.toFixed(2)} − ${sur.toFixed(2)} − ${stamp.toFixed(2)} ＝ ${taxableInc.toFixed(2)}，所得为负 ＝ 0.00`;
        let vatPayCn = unusedVat > 0 ? '销项税额 − 进项税额；不够抵按零缴纳' : '销项税额 − 进项税额';
        let vatPayNum = unusedVat > 0
            ? `${totals.outVat.toFixed(2)} − ${totals.inVat.toFixed(2)} ＝ 0.00`
            : `${totals.outVat.toFixed(2)} − ${totals.inVat.toFixed(2)} ＝ ${payVat.toFixed(2)}`;

        let unusedChip = unusedVat > 0
            ? chipHtml('tax', '未抵扣进项', '进项税额 − 销项税额；单趟用不掉计入成本', `${totals.inVat.toFixed(2)} − ${totals.outVat.toFixed(2)} ＝ ${unusedVat.toFixed(2)}`, unusedVat.toFixed(2), false)
            : '';
        let deductChip = deductDiffers
            ? chipHtml('base', '税前扣除', '专票按不含税、普票按全额、没票不扣', totals.taxDeductItems.map(it => it.num).join(' ＋ ') + ` ＝ ${totals.taxDeduct.toFixed(2)}`, totals.taxDeduct.toFixed(2), false, totals.taxDeductItems)
            : '';
        let revExclJoin = totals.revExclNums.join(' ＋ ') + (totals.revExclNums.length > 1 ? ` ＝ ${totals.revExcl.toFixed(2)}` : '');
        let costExclJoin = totals.costExclNums.join(' ＋ ') + (totals.costExclNums.length > 1 ? ` ＝ ${totals.costExcl.toFixed(2)}` : '');
        let outVatJoin = totals.outVatItems.map(it => it.num.split(' ＝ ').pop()).join(' ＋ ');
        if (totals.outVatItems.length > 1) outVatJoin += ` ＝ ${totals.outVat.toFixed(2)}`;
        else if (totals.outVatItems.length === 1) outVatJoin = totals.outVatItems[0].num;
        let inVatJoin = totals.inVatItems.map(it => it.num.includes('＝') ? it.num.split(' ＝ ').pop() : it.num).join(' ＋ ');
        if (totals.inVatItems.length > 1) inVatJoin += ` ＝ ${totals.inVat.toFixed(2)}`;
        else if (totals.inVatItems.length === 1) inVatJoin = totals.inVatItems[0].num;

        let baseStrip = `
                <div class="strip-block">
                    <div class="strip-head">基础模块 · 不含税口径只算一次</div>
                    <div class="tax-strip">
                        ${chipHtml('base', '不含税收入', '含税开票：含税收入 ÷（1＋销项税率）。不开票：不含税等于实收', revExclJoin, totals.revExcl.toFixed(2), false, totals.revExclItems)}
                        ${chipHtml('base', '不含税成本', '专票剔进项；普票、没票等于含税支出', costExclJoin, totals.costExcl.toFixed(2), false, totals.costExclItems)}
                        ${deductChip}
                    </div>
                </div>`;
        let taxStrip = `
                <div class="strip-block">
                    <div class="strip-head">税费模块 · 引用上方结果</div>
                    <div class="tax-strip">
                        ${chipHtml('tax', '销项税额', '含税收入 − 不含税收入', outVatJoin, totals.outVat.toFixed(2), false, totals.outVatItems)}
                        ${chipHtml('tax', '进项税额', '专票、代扣：含税支出 − 不含税成本。普票、没票不能抵', inVatJoin, totals.inVat.toFixed(2), false, totals.inVatItems)}
                        ${chipHtml('tax', '应缴增值税', vatPayCn, vatPayNum, payVat.toFixed(2), true)}
                        ${unusedChip}
                        ${chipHtml('tax', '附加税', '应缴增值税 × 附加税率', `${payVat.toFixed(2)} × ${(surRate * 100).toFixed(0)}% ＝ ${sur.toFixed(2)}`, sur.toFixed(2), true)}
                        ${chipHtml('tax', '印花税', '勾选项目不含税价款相加，再 × 印花税率', stampNum, stamp.toFixed(2), true, totals.stampItems)}
                        ${chipHtml('tax', '企业所得税', incCn, incNum, incTax.toFixed(2), true)}
                    </div>
                </div>`;

        let reportHtml = `
            <div class="card">
                <div class="card-header">
                    <h2>📋 成本核算（一般纳税人 · 现金流 VS 利润表）</h2>
                    <div class="order-badge">
                        <span class="tag">一般纳税人</span>
                        <span class="tag">数量 ${qty}</span>
                        <span class="tag">附加税 ${(surRate*100).toFixed(0)}%</span>
                        <span class="tag">所得税 ${(incRate*100).toFixed(0)}%</span>
                        <span class="tag">印花税 ${(stampRate*10000).toFixed(0)}‱</span>
                    </div>
                </div>
                ${baseStrip}
                ${taxStrip}
                <div class="split-panel">
                    <div class="panel panel-cash">
                        <div class="panel-title">💰 含税现金流 <span class="badge">实际收付</span></div>
                        <div class="block-positive">
                            <div class="block-label">⬆ 收入</div>
                            ${totals.revsHtml}
                            <div class="row-item row-total">
                                <span class="row-label">收入合计</span>
                                <span class="row-detail">${dual('各项含税收入相加', revCashNum)}</span>
                                <span class="row-value positive">+${totals.cashRev.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="block-negative">
                            <div class="block-label">⬇ 成本支出</div>
                            ${totals.costHtml}
                            <div class="row-item row-total">
                                <span class="row-label">成本支出合计</span>
                                <span class="row-detail">${dual('各项含税支出相加', costCashNum)}</span>
                                <span class="row-value negative">−${totals.cashCost.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="block-tax">
                            <div class="block-label">⬇ 税费</div>
                            <div class="row-item row-total" style="border-bottom: none;">
                                <span class="row-label">税费总计</span>
                                <span class="row-detail">${dual('应缴增值税 ＋ 附加税 ＋ 印花税 ＋ 企业所得税', totalTaxNum)}</span>
                                <span class="row-value total-tax">−${totalTax.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="block-result">
                            <div class="block-label">📊 结果 · 净利</div>
                            <div class="row-item row-line">
                                <span class="row-label">账面现金毛利</span>
                                <span class="row-detail">${dual('收入合计 − 成本支出合计', cashMarginNum)}</span>
                                <span class="row-value">${cashMargin>=0?'+':''}${cashMargin.toFixed(2)}</span>
                            </div>
                            <div class="row-item row-total" style="border-bottom: none;">
                                <span class="row-label">① 现金流净利</span>
                                <span class="row-detail">${dual('账面现金毛利 − 税费总计', cashProfitNum)}</span>
                                <span class="row-value big ${netProfit>=0?'green':'negative'}">${netProfit>=0?'+':''}${netProfit.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="panel panel-tax">
                        <div class="panel-title">🧾 不含税利润表 <span class="badge">测算基础</span></div>
                        <div class="block-positive">
                            <div class="block-label">⬆ 不含税收入</div>
                            ${totals.revExclHtml}
                            <div class="row-item row-total">
                                <span class="row-label">不含税收入合计</span>
                                <span class="row-detail">${dual('各项不含税收入相加', revExclNum)}</span>
                                <span class="row-value positive">${totals.revExcl.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="block-negative">
                            <div class="block-label">⬇ 不含税成本</div>
                            ${totals.costExclHtml}
                            <div class="row-item row-total">
                                <span class="row-label">📦 不含税成本合计</span><span class="row-detail">${dual('各项不含税成本相加', costExclNum)}</span><span class="row-value negative">−${totals.costExcl.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="block-tax">
                            <div class="block-label">⬇ 其他税费</div>
                            <div class="row-item row-total" style="border-bottom: none;">
                                <span class="row-label">其他税费合计</span>
                                <span class="row-detail">${dual('附加税 ＋ 印花税 ＋ 企业所得税', otherTaxNum)}</span>
                                <span class="row-value total-tax">−${otherTax.toFixed(2)}</span>
                            </div>
                        </div>
                        <div class="block-result">
                            <div class="block-label">📊 结果 · 净利</div>
                            <div class="row-item row-total" style="border-bottom: none;">
                                <span class="row-label">② 利润表净利</span>
                                <span class="row-detail">${dual('不含税收入合计 − 不含税成本合计 − 其他税费合计', pnlProfitNum)}</span>
                                <span class="row-value big ${f2Profit>=0?'green':'negative'}">${f2Profit>=0?'+':''}${f2Profit.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="result-area">
                    <div class="result-item">
                        <span class="label">✅ 交叉验证</span>
                        <span class="number ${netProfit>=0?'green':'red'}">${netProfit.toFixed(2)}</span>
                        <span style="color:#2a4f77; font-weight:500;">= ${f2Profit.toFixed(2)}</span>
                        <span class="check-mark ${Math.abs(netProfit - f2Profit)<0.01 ? 'success':'error'}">${Math.abs(netProfit - f2Profit)<0.01 ? '✔ 两项净利一致':'❌ 数据有误差'}</span>
                    </div>
                </div>
                <div class="footnote">
                    <span>📌 含税收入 ${totals.cashRev.toFixed(2)}</span><span>📌 不含税收入 ${totals.revExcl.toFixed(2)}</span>
                    <span>📌 含税成本 ${totals.cashCost.toFixed(2)}</span><span>📌 不含税成本 ${totals.costExcl.toFixed(2)}</span>
                    <span style="margin-left: auto;">📊 税费占含税收入 ${compTaxRate}%</span>
                </div>
            </div>`;
        document.getElementById('reportView').innerHTML = reportHtml;
    }

    buildForms();
    render();
</script>
</body>
</html>
