<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>单笔业务成本核算 0.99版 · 一般纳税人</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --line: #e5e7eb;
            --line-strong: #d1d5db;
            --text: #111827;
            --text-2: #4b5563;
            --text-3: #6b7280;
            --brand: #2563eb;
            --brand-soft: #eff6ff;
            --ok: #059669;
            --ok-soft: #ecfdf5;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
            --warn: #d97706;
            --warn-soft: #fffbeb;
            --violet: #7c3aed;
            --violet-soft: #f5f3ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        html { -webkit-text-size-adjust: 100%; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        
        .app-container { display: grid; grid-template-columns: 38fr 62fr; gap: 20px; padding: 20px; width: 100%; height: 100%; min-width: 0; }
        
        .sidebar {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px 26px 28px;
            min-width: 0;
        }
        .sidebar h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.2px;
        }
        
        .form-group { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; background: var(--surface-soft); }
        .form-group-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px; letter-spacing: 0.2px; }
        .form-group-title > span { display: inline-flex; align-items: center; gap: 6px; }
        .title-params { color: #1d4ed8; }
        .title-rev { color: #047857; }
        .title-cost { color: #b91c1c; }
        .title-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .taxpayer-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .policy-note { margin-top: 10px; font-size: 11px; line-height: 1.65; color: #94a3b8; }
        .btn-guide { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; min-width: 72px; }
        .guide-mask {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(15, 23, 42, 0.45);
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .guide-mask.show { display: flex; }
        .guide-box {
            width: min(560px, 100%);
            max-height: min(80vh, 640px);
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.22);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .guide-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }
        .guide-hd span { font-size: 16px; font-weight: 700; color: var(--text); }
        .guide-close {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--line-strong);
            background: #f8fafc;
            color: var(--text-2);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .guide-close:hover { background: #eef2f7; color: var(--text); }
        .guide-body { padding: 14px 18px 18px; overflow-y: auto; font-size: 13px; line-height: 1.7; color: #334155; }
        .guide-body .p-head { font-weight: 600; color: #1e293b; margin-bottom: 10px; }
        .guide-body .p-line { margin-top: 8px; }
        .be-box { width: min(480px, 100%); }
        .be-box .be-row { font-size: 14px; color: #334155; margin-top: 8px; }
        .be-box .be-row b { color: #059669; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .be-box .be-sub { font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.6; }
        .taxpayer-bar .gs-label { margin-right: 2px; }
        #appTip {
            position: fixed;
            z-index: 2000;
            max-width: min(280px, calc(100vw - 16px));
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.5;
            color: #1e3a5f;
            background: #eef4ff;
            border: 1px solid #bfdbfe;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
        
        .grid-settings {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            column-gap: 12px;
            row-gap: 10px;
            align-items: center;
        }
        .gs-item { display: flex; align-items: center; justify-content: flex-start; gap: 8px; min-width: 0; }
        .gs-label { font-size: 12px; color: var(--text); font-weight: 600; flex: 0 0 auto; }
        .gs-ctl { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
        .gs-ctl input[type="number"] { width: 72px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 14px; text-align: center; font-weight: 700; color: var(--text); background: var(--surface); }
        .gs-ctl input:focus, .list-row input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .pct-field { display: inline-flex; align-items: center; gap: 4px; }
        .pct-mark { font-size: 13px; font-weight: 600; color: var(--text-3); min-width: 16px; }
        .row-value, .tax-chip .v, .be-box .be-row b, .result-item .number { font-variant-numeric: tabular-nums; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
        
        .highlight-linked { background-color: var(--ok-soft) !important; border-color: #a7f3d0 !important; color: #047857 !important; }
        .tone-qty { background: #eff6ff !important; border-color: #bfdbfe !important; color: #1d4ed8 !important; }
        .tone-sur { background: #fffbeb !important; border-color: #fde68a !important; color: #b45309 !important; }
        .tone-inc { background: #f5f3ff !important; border-color: #ddd6fe !important; color: #6d28d9 !important; }
        .tone-stamp { background: #fff1f2 !important; border-color: #fecdd3 !important; color: #be123c !important; }

        .list-head { display: flex; align-items: center; gap: 6px; padding: 0 8px 6px; font-size: 12px; color: var(--text-3); font-weight: 600; }
        .list-head .col-name { width: 100px; }
        .list-head .col-amt { width: 64px; text-align: center; }
        .list-head .col-rate { width: 86px; text-align: center; }
        .list-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; background: var(--surface); padding: 8px; border-radius: 10px; border: 1px solid var(--line); flex-wrap: nowrap; }
        .list-row input.name-input { width: 100px; min-width: 100px; flex: 0 0 auto; padding: 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--text); }
        .list-row input.num-input { width: 64px; flex: 0 0 64px; padding: 6px; border: 1px solid var(--line-strong); border-radius: 6px; text-align: center; background: var(--surface); color: var(--text); }
        .list-row .pct-field { flex: 0 0 auto; }
        .list-row .pct-field input { width: 64px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; text-align: center; font-weight: 600; background: var(--surface); color: var(--text); }
        
        .btn-toggle { padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.15s ease; display: inline-flex; align-items: center; justify-content: center; min-width: 52px; white-space: nowrap; }
        .btn-gray { background: #f3f4f6; color: var(--text-2); border-color: var(--line); }
        .btn-green { background: var(--ok-soft); color: var(--ok); border-color: #a7f3d0; }
        .btn-blue { background: var(--brand-soft); color: var(--brand); border-color: #bfdbfe; }
        .btn-red { background: var(--danger-soft); color: var(--danger); border-color: #fecaca; }
        .btn-purple { background: var(--violet-soft); color: var(--violet); border-color: #ddd6fe; }
        .btn-stamp { background: var(--warn-soft); color: var(--warn); border-color: #fde68a; min-width: 52px; }
        .btn-toggle:hover { filter: brightness(0.97); }
        .btn-add { width: 100%; padding: 10px; border: 1px dashed var(--line-strong); background: transparent; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-3); cursor: pointer; margin-top: 5px; }
        .btn-add:hover { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
        .btn-del { background: transparent; border: none; font-size: 16px; color: #c4c9d2; cursor: pointer; padding: 4px; }
        .btn-del:hover { color: var(--danger); }

        /* 右侧报表区：与左侧同一套卡片 */
        .report-view { padding: 0; overflow: hidden; background: transparent; display: flex; min-width: 0; height: 100%; }
        .card { max-width: none; width: 100%; min-width: 0; height: 100%; background: var(--surface); border-radius: 20px; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06); border: 1px solid var(--line); padding: 24px 26px 28px; overflow-x: hidden; overflow-y: auto; }
        .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 18px; border-bottom: 1px solid var(--line); padding-bottom: 14px; gap: 8px; }
        .card-header h2 { font-size: 20px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 12px; letter-spacing: -0.2px; min-width: 0; }
        .order-badge { background: var(--surface-soft); padding: 6px 14px; border-radius: 999px; font-size: 13px; color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); }
        .order-badge .tag { background: var(--surface); padding: 2px 10px; border-radius: 999px; font-weight: 500; color: var(--text-2); border: 1px solid var(--line); }
        .split-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 10px 0 20px; min-width: 0; }

        .strip-block { margin: 0 0 14px; min-width: 0; }
        .strip-head { font-size: 12px; font-weight: 600; color: var(--text-3); margin-bottom: 6px; letter-spacing: 0.2px; }
        .tax-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-width: 0;
        }
        .tax-chip {
            background: var(--warn-soft);
            border: 1px solid #fde68a;
            border-radius: 12px;
            padding: 10px 12px;
            min-width: 0;
            flex: 1 1 148px;
            display: flex;
            flex-direction: column;
            overflow-x: clip;
        }
        .tax-chip.base { background: var(--ok-soft); border-color: #a7f3d0; }
        .tax-chip.base.cost { background: var(--danger-soft); border-color: #fecaca; }
        .tax-chip .k { font-size: 12px; color: #92400e; font-weight: 600; letter-spacing: 0.2px; }
        .tax-chip.base .k { color: var(--ok); }
        .tax-chip.base.cost .k { color: var(--danger); }
        .tax-chip .lines { margin: 6px 0 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .tax-chip[data-tip], .panel [data-tip], .result-area [data-tip], .footnote [data-tip] { cursor: help; }
        .tax-chip .d-num { font-size: 12px; color: var(--text-2); font-weight: 500; margin-top: 6px; line-height: 1.5; font-variant-numeric: tabular-nums; white-space: normal; overflow-wrap: break-word; word-break: break-word; min-width: 0; max-width: 100%; }
        .tax-chip .line { display: flex; flex-direction: row; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
        .tax-chip .line.is-fig { flex-direction: column; align-items: stretch; gap: 2px; }
        .tax-chip .line .nm { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 100%; }
        .tax-chip .line.is-fig .nm { white-space: normal; overflow: visible; text-overflow: unset; }
        .tax-chip .line .num { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; text-align: right; flex: 1 1 auto; min-width: 0; line-height: 1.5; overflow-wrap: break-word; word-break: break-word; }
        .tax-chip .line.is-fig .num { text-align: left; flex: 0 1 auto; width: 100%; white-space: normal; overflow-wrap: break-word; word-break: break-word; }
        .tax-chip .v {
            font-size: 18px;
            font-weight: 700;
            color: var(--warn);
            font-variant-numeric: tabular-nums;
            margin-top: auto;
            padding-top: 10px;
            text-align: right;
            align-self: stretch;
        }
        .tax-chip.base .v { color: var(--ok); }
        .tax-chip.base.cost .v { color: var(--danger); }
        .tax-chip .v.neg { color: var(--warn); }
        .panel { background: var(--surface-soft); border-radius: 16px; padding: 16px 16px 18px; border: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
        .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 10px; flex-shrink: 0; color: var(--text); }
        .panel-title .badge { font-size: 12px; background: var(--surface); padding: 2px 10px; border-radius: 999px; font-weight: 500; color: var(--text-2); border: 1px solid var(--line); }
        .panel-cash .panel-title { color: #1e3a8a; } .panel-tax .panel-title { color: #92400e; }
        
        .block-positive { background: var(--ok-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; border-left: 3px solid var(--ok); }
        .block-positive .block-label { font-size: 13px; font-weight: 600; color: #047857; margin-bottom: 4px; }
        .block-negative { background: var(--danger-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; border-left: 3px solid var(--danger); }
        .block-negative .block-label { font-size: 13px; font-weight: 600; color: #b91c1c; margin-bottom: 4px; }
        .block-tax { background: var(--warn-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; border-left: 3px solid var(--warn); }
        .block-tax .block-label { font-size: 13px; font-weight: 600; color: #b45309; margin-bottom: 4px; }
        
        .block-result { background: var(--brand-soft); border-radius: 12px; padding: 10px 14px; border-left: 3px solid var(--brand); margin-top: auto; }
        .block-result .block-label { font-size: 13px; font-weight: 600; color: #1d4ed8; margin-bottom: 4px; }
        
        .row-item { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13.5px; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.04); gap: 6px; min-width: 0; }
        .row-item:last-of-type { border-bottom: none; }
        .row-label { color: var(--text-2); font-weight: 400; font-size: 13.5px; flex: 0 1 auto; min-width: 0; }
        .row-detail { color: var(--text-3); font-size: 12px; font-weight: 400; flex: 1 1 auto; text-align: center; padding: 0 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.4; min-width: 0; overflow-wrap: break-word; word-break: break-word; }
        .f-cn, .f-num { font-size: 12px; font-weight: 400; max-width: 100%; line-height: 1.4; }
        .f-cn { color: var(--text-3); }
        .f-num { color: var(--text-2); font-variant-numeric: tabular-nums; overflow-wrap: break-word; word-break: break-word; }
        .row-value { font-weight: 400; font-size: 13.5px; font-variant-numeric: tabular-nums; flex: 0 0 auto; min-width: 70px; text-align: right; color: var(--text-2); }
        .row-value.big { font-size: 17px; font-weight: 700; }
        
        .row-value.positive { color: var(--ok); }
        .row-value.negative { color: var(--danger) !important; }
        .row-value.green { color: var(--ok); }

        /* 拆项：左右同一字号、同一颜色 */
        .row-line, .sub-row { padding-left: 20px; font-size: 13.5px; color: var(--text-2); border-left: 2px solid var(--line); margin-left: 4px; font-weight: 400; }
        .row-line .row-label, .sub-row .row-label { font-weight: 400; font-size: 13.5px; color: var(--text-2); min-width: 0; }
        .row-line .row-detail, .sub-row .row-detail { font-size: 12px; }
        .row-line .row-value, .sub-row .row-value,
        .row-line .row-value.positive, .sub-row .row-value.positive,
        .row-line .row-value.negative, .sub-row .row-value.negative,
        .row-line .row-value.sub-val, .sub-row .row-value.sub-val {
            color: var(--text-2) !important;
            font-weight: 400 !important;
            font-size: 13.5px !important;
        }

        /* 分项合计：比总合计小一号 */
        .row-subtotal { font-size: 13.5px; }
        .row-subtotal .row-label { font-weight: 600; font-size: 13.5px; }
        .row-subtotal .row-value {
            font-weight: 600 !important;
            font-size: 14px !important;
        }
        .row-subtotal .row-value.positive { color: var(--ok) !important; }
        .row-subtotal .row-value.negative { color: var(--danger) !important; }
        .row-subtotal .row-value.total-tax { color: var(--warn) !important; }

        /* 总项合计：左右同一套 */
        .row-total { font-size: 14px; }
        .row-total .row-label { font-weight: 600; font-size: 14px; color: var(--text); }
        .row-total .row-detail { font-size: 12px; }
        .row-total .row-value { font-weight: 700 !important; font-size: 15px !important; }
        .row-total .row-value.positive { color: var(--ok) !important; }
        .row-total .row-value.negative { color: var(--danger) !important; }
        .row-total .row-value.total-tax { color: var(--warn) !important; }
        .row-total .row-value.green { color: var(--ok) !important; }
        .row-total .row-value.big { font-size: 17px !important; }

        .hl-bold { font-weight: 600; color: var(--text); }

        .border-top-thin { border-top: 1px solid #dbb8b8; margin: 4px 0 2px; }
        .border-top-tax { border-top: 1px solid #dbb89e; margin: 4px 0 2px; }

        .result-area { background: var(--brand-soft); border-radius: 14px; padding: 14px 20px; margin: 16px 0 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; border: 1px solid #bfdbfe; }
        .result-item { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .result-item .label { font-size: 14px; color: #1d4ed8; font-weight: 600; }
        .result-item .number { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
        .result-item .number.green { color: var(--ok); }
        .result-item .number.red { color: var(--danger); }
        .check-mark { padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
        .check-mark.success { background: var(--ok-soft); color: #047857; border: 1px solid #a7f3d0; }
        .check-mark.error { background: var(--danger-soft); color: var(--danger); border: 1px solid #fecaca; }
        
        .footnote { margin-top: 16px; font-size: 13px; color: var(--text-3); background: var(--surface-soft); padding: 10px 16px; border-radius: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; border: 1px solid var(--line); }
        .footnote span { font-weight: 500; color: var(--text-2); flex: 1 1 0; min-width: 0; text-align: center; }

        @media (max-width: 900px) {
            body { height: auto; min-height: 100dvh; overflow-x: hidden; overflow-y: auto; }
            .app-container { display: flex; flex-direction: column; height: auto; min-height: 100dvh; gap: 12px; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
            .sidebar {
                border-right: none;
                overflow: visible;
                height: auto;
                padding: 20px 16px;
            }
            .sidebar h1 { font-size: 16px; margin-bottom: 14px; padding-bottom: 12px; flex-wrap: wrap; }
            .form-group { padding: 12px; }
            .form-group-title { flex-wrap: wrap; }
            .title-actions { width: 100%; justify-content: flex-start; }
            .taxpayer-bar { flex-wrap: wrap; }
            .grid-settings { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 8px; }
            .gs-item { flex-wrap: wrap; }
            .gs-ctl input[type="number"],
            .list-row input.num-input,
            .list-row .pct-field input { font-size: 16px; }
            .list-head { display: none; }
            .list-row { gap: 6px; flex-wrap: wrap; }
            .list-row input.name-input {
                flex: 1 1 100%;
                width: 100% !important;
                min-width: 0;
                font-size: 16px;
            }
            .btn-toggle { min-height: 36px; min-width: 48px; padding: 8px 10px; }
            .btn-add { min-height: 44px; }
            .report-view { padding: 0; overflow: visible; height: auto; }
            .card { padding: 20px 16px; border-radius: 20px; height: auto; overflow: visible; }
            .card-header { gap: 8px; }
            .card-header h2 { font-size: 16px; line-height: 1.4; }
            .split-panel { grid-template-columns: minmax(0, 1fr); gap: 14px; }
            .tax-chip { flex: 1 1 140px; }
            .row-item { flex-wrap: wrap; align-items: flex-start; }
            .row-label { min-width: 0; flex: 1 1 auto; }
            .row-detail { flex: 1 1 100%; order: 3; text-align: left; align-items: flex-start; padding: 2px 0 0; }
            .row-value { margin-left: auto; }
            .footnote { margin-left: 0; }
            .footnote span { margin-left: 0 !important; flex: 1 1 calc(50% - 8px); }
            .result-area { padding: 12px 14px; }
            .result-item .number { font-size: 20px; }
            .guide-mask { padding: 12px 10px; align-items: flex-end; }
            .guide-box { width: 100%; max-height: min(88dvh, 720px); border-radius: 16px 16px 0 0; }
        }
        @media (max-width: 480px) {
            .tax-chip { flex: 1 1 100%; }
            .grid-settings { grid-template-columns: minmax(0, 1fr); }
            .gs-item { justify-content: space-between; }
            .order-badge { width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar" id="sidebar">
        <h1 id="pageTitle">⚙️ 单笔业务成本核算 · 一般纳税人</h1>
        
        <div class="form-group">
            <div class="form-group-title title-params">
                <span>🎛 测算参数</span>
                <div class="title-actions">
                    <button class="btn-toggle btn-guide" id="btnGuide" onclick="openGuide(event)">必看说明</button>
                    <button class="btn-toggle btn-gray" id="btnPlatform" onclick="togglePlatform()" data-tip="开启后，第一项成本自动设为代扣代缴并带出代扣税率；金额栏填承运人净额。关闭后恢复原票种">已关闭 代扣代缴</button>
                </div>
            </div>
            <div class="taxpayer-bar">
                <span class="gs-label" data-tip="决定能否抵扣进项税额，以及左侧税率为销项税率还是征收率">纳税身份</span>
                <button class="btn-toggle btn-blue" id="btnTaxGeneral" onclick="setTaxpayer('general')" data-tip="一般纳税人：专用发票、代扣代缴可抵扣进项税额，按销项税率计税">一般纳税人</button>
                <button class="btn-toggle btn-gray" id="btnTaxSmall" onclick="setTaxpayer('small')" data-tip="小规模纳税人：不得抵扣进项税额，按征收率计税；取得专用发票亦按价税合计计入营业成本">小规模纳税人</button>
            </div>
            <div class="grid-settings">
                <div class="gs-item" data-tip="附加税费 = 应交增值税 × 本税率。城市维护建设税、教育费附加、地方教育附加可合计填写">
                    <span class="gs-label">附加税费</span>
                    <div class="gs-ctl"><input class="tone-sur" type="number" id="surchargeRate" value="6" step="0.1" oninput="render()"><span class="pct-mark">%</span></div>
                </div>
                <div class="gs-item" data-tip="企业所得税税率，按实际税负填写；应纳税所得额为负时不征">
                    <span class="gs-label">企业所得税率</span>
                    <div class="gs-ctl"><input class="tone-inc" type="number" id="incomeRate" value="5" step="0.1" oninput="render()"><span class="pct-mark">%</span></div>
                </div>
                <div class="gs-item" data-tip="印花税按勾选项目的计税依据合计计征。万分之三填 3，减半填 1.5">
                    <span class="gs-label">印花税率</span>
                    <div class="gs-ctl"><input class="tone-stamp" type="number" id="stampRate" value="1.5" step="0.1" oninput="render()"><span class="pct-mark">‱</span></div>
                </div>
                <div class="gs-item" data-tip="一般纳税人为销项税率；小规模纳税人为征收率。第一项开票收入的税率随此项联动">
                    <span class="gs-label" id="lblUpstream">销项税率</span>
                    <div class="gs-ctl"><input class="highlight-linked" type="number" id="upstreamRate" value="9" step="0.1" oninput="syncUpstreamRate(this.value)"><span class="pct-mark">%</span></div>
                </div>
                <div class="gs-item" data-tip="同一套收支按几倍测算，金额和税费均乘以该数量">
                    <span class="gs-label">业务数量</span>
                    <div class="gs-ctl"><input class="tone-qty" type="number" id="qty" value="1" oninput="render()"></div>
                </div>
                <div class="gs-item" id="wrapPlatRate" style="display: none;" data-tip="代扣代缴税率。成本金额栏请填承运人净额，系统还原为价税合计">
                    <span class="gs-label">代扣税率</span>
                    <div class="gs-ctl"><input class="highlight-linked" type="number" id="platRate" value="7.5" step="0.1" oninput="syncPlatRate(this.value)"><span class="pct-mark">%</span></div>
                </div>
            </div>
            <div class="policy-note" id="policyNote"></div>
        </div>

        <div class="form-group">
            <div class="form-group-title title-rev"><span>💰 营业收入</span></div>
            <div class="list-head"><span class="col-name" data-tip="收入项目名称">项目</span><span class="col-amt" data-tip="开票填价税合计单价；不开票填实收单价">单价</span><span class="col-rate" data-tip="开票为增值税税率或征收率；不开票为 0">税率</span></div>
            <div id="revContainer"></div>
            <button class="btn-add" onclick="addRevRow()" data-tip="增加一项收入">➕ 添加收入项</button>
        </div>

        <div class="form-group">
            <div class="form-group-title title-cost">
                <span>💸 营业成本</span>
                <button id="btnBreakeven" onclick="showBreakeven(event)" data-tip="按当前成本测算：客户不开票应付多少、开票价税合计应付多少方可保本" style="background: var(--ok-soft); color: var(--ok); border: 1px solid #a7f3d0; padding: 4px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
                    ⚖️ 保本测算
                </button>
            </div>
            <div class="list-head"><span class="col-name" data-tip="成本项目名称">项目</span><span class="col-amt" data-tip="一般填价税合计单价；代扣代缴请填承运人净额，双击可倒推">单价</span><span class="col-rate" data-tip="增值税税率、征收率，或代扣代缴税率">税率</span></div>
            <div id="costContainer"></div>
            <button class="btn-add" onclick="addCostRow()" data-tip="增加一项成本">➕ 添加成本项</button>
        </div>
    </div>

    <div class="report-view" id="reportView"></div>
</div>

<div id="guideMask" class="guide-mask" onclick="onGuideMaskClick(event)">
    <div class="guide-box" onclick="event.stopPropagation()">
        <div class="guide-hd">
            <span>必看说明</span>
            <button type="button" class="guide-close" onclick="closeGuide()">关闭</button>
        </div>
        <div class="guide-body" id="guideBody"></div>
    </div>
</div>

<div id="beMask" class="guide-mask" onclick="onBeMaskClick(event)">
    <div class="guide-box be-box" onclick="event.stopPropagation()">
        <div class="guide-hd">
            <span>⚖️ 保本测算</span>
            <button type="button" class="guide-close" onclick="closeBreakeven()">关闭</button>
        </div>
        <div class="guide-body" id="beBody"></div>
    </div>
</div>

<script>
    let state = {
        usePlatform: false,
        taxpayer: 'general',
        revs: [ { id: 1, name: "主营业务收入", amt: 55, rate: 0.09, inc: true, stamp: true } ],
        costs: [
            { id: 1, name: "外包运费", amt: 40, rate: 0.01, ticket: 2, stamp: true },
            { id: 2, name: "居间服务", amt: 10, rate: 0.01, ticket: 1, stamp: false }
        ],
        nextId: 10
    };

    function dRound(num) {
        return Math.round((parseFloat(num) + Number.EPSILON) * 100) / 100;
    }

    // 按电脑当前日期判断是否在 2023-01-01～2027-12-31 优惠期内
    function inPrefTaxWindow(d) {
        d = d || new Date();
        return d.getTime() >= new Date(2023, 0, 1).getTime()
            && d.getTime() <= new Date(2027, 11, 31, 23, 59, 59, 999).getTime();
    }

    function defaultRates() {
        let pref = inPrefTaxWindow();
        return {
            pref: pref,
            surchargePct: pref ? 6 : 12,
            incomePct: pref ? 5 : 25,
            stampPermil: pref ? 1.5 : 3,
            smallVatPct: pref ? 1 : 3
        };
    }

    function applyPolicyDefaults() {
        let r = defaultRates();
        let sur = document.getElementById('surchargeRate');
        let inc = document.getElementById('incomeRate');
        let stamp = document.getElementById('stampRate');
        if (sur) sur.value = r.surchargePct;
        if (inc) inc.value = r.incomePct;
        if (stamp) stamp.value = r.stampPermil;
        let note = document.getElementById('policyNote');
        let head = r.pref
            ? '已按系统日期套用 2023-01-01～2027-12-31 的优惠默认值：附加税费 6%、印花税 1.5‱、企业所得税 5%；切换为小规模纳税人时征收率默认 1%。居间服务默认免征印花税。'
            : '优惠期已结束，默认改为：附加税费 12%、印花税 3‱、企业所得税 25%；切换为小规模纳税人时征收率默认 3%。居间服务默认免征印花税。';
        if (note) note.textContent = head;
        let box = document.getElementById('guideBody');
        if (box) {
            box.innerHTML = '<div class="p-line">1. 本页按「单笔业务」测算，不按月汇总销售额。切换为小规模纳税人时，仅默认按 1% 征收率计税，不会因「月销售额不超过 10 万元」自动免税。业务数量调大后，税额同步放大；是否适用免税请自行对照当月销售额判断。</div>'
                + '<div class="p-line">2. 企业所得税默认 5%，对应小型微利企业的实际税负（减计所得后再按 20% 税率）。系统不校验是否满足：年应纳税所得额不超过 300 万元、从业人数不超过 300 人、资产总额不超过 5000 万元。若公司不属于小型微利企业，请将企业所得税率改为实际税率，否则会低估应纳税额。</div>'
                + '<div class="p-line">3. 附加税费默认 6%，按市区常见的「城市维护建设税 + 教育费附加 + 地方教育附加 ≈ 12%」再减半。城市维护建设税各地不同（7%、5%、1%），当地合计不是 12% 时，请改左侧附加税费率。</div>'
                + '<div class="p-line">4. 右侧「营业成本」：增值税专用发票按不含税金额；普通发票和无票按价税合计。请勿将全部成本理解为已剔除增值税。</div>'
                + '<div class="p-line">5. 一般纳税人销项税率默认 9%，不适用小规模纳税人的增值税减免（月销售额免税、3% 减按 1%）。本页按一般纳税人身份计税。</div>';
        }
    }

    function openGuide(e) {
        if (e) e.stopPropagation();
        hideAppTip();
        closeBreakeven();
        let mask = document.getElementById('guideMask');
        if (mask) mask.classList.add('show');
    }

    function closeGuide() {
        let mask = document.getElementById('guideMask');
        if (mask) mask.classList.remove('show');
    }

    function onGuideMaskClick(e) {
        if (e.target && e.target.id === 'guideMask') closeGuide();
    }

    function closeBreakeven() {
        let mask = document.getElementById('beMask');
        if (mask) mask.classList.remove('show');
    }

    function onBeMaskClick(e) {
        if (e.target && e.target.id === 'beMask') closeBreakeven();
    }

    // 应交增值税与未抵扣进项：销项不够抵时差额转入成本，不退税
    function vatSettle(outVat, inVat) {
        return {
            payVat: dRound(Math.max(0, outVat - inVat)),
            unusedVat: dRound(Math.max(0, inVat - outVat))
        };
    }

    // 按税率把价税合计拆成营业收入和税额
    function vatSplit(cash, rate) {
        cash = dRound(cash);
        if (rate > 0) {
            let excl = dRound(cash / (1 + rate));
            return { excl: excl, vat: dRound(cash - excl) };
        }
        return { excl: cash, vat: 0 };
    }

    function splitRev(r, qty, force) {
        let inc = force && force.inc != null ? force.inc : r.inc;
        let rate = force && force.rate != null ? force.rate : r.rate;
        let amt = force && force.cash != null ? force.cash : r.amt * qty;
        let cash, excl, outVat;
        if (inc) {
            cash = dRound(amt);
            let split = vatSplit(cash, rate);
            excl = split.excl;
            outVat = split.vat;
        } else {
            excl = dRound(amt);
            outVat = dRound(excl * rate);
            cash = dRound(excl + outVat);
        }
        return { cash: cash, excl: excl, outVat: outVat };
    }

    function isSmall() { return state.taxpayer === 'small'; }

    function taxpayerName() { return isSmall() ? '小规模纳税人' : '一般纳税人'; }

    function rateLabel() { return isSmall() ? '征收率' : '销项税率'; }

    // 代扣进项按销项税率拆；普通发票不得抵扣进项，但印花税按不含税价款
    // 小规模纳税人不得抵扣进项：专用发票/代扣亦按价税合计计入营业成本
    function splitCost(c, qty, pRate, upRate, smallMode) {
        if (smallMode === undefined) smallMode = isSmall();
        let raw;
        if (c.ticket === 3) {
            let net = dRound(c.amt * qty);
            let cash = (pRate > 0 && pRate < 1) ? dRound(net / (1 - pRate)) : net;
            let split = vatSplit(cash, upRate);
            raw = { cash: cash, excl: split.excl, inVat: split.vat, costDeduct: split.excl, taxDeduct: split.excl, stampExcl: split.excl };
        } else {
            let cash = dRound(c.amt * qty);
            if (c.ticket === 2) {
                let split = vatSplit(cash, c.rate);
                raw = { cash: cash, excl: split.excl, inVat: split.vat, costDeduct: split.excl, taxDeduct: split.excl, stampExcl: split.excl };
            } else if (c.ticket === 1) {
                let split = vatSplit(cash, c.rate);
                raw = { cash: cash, excl: split.excl, inVat: 0, costDeduct: cash, taxDeduct: cash, stampExcl: split.excl };
            } else {
                raw = { cash: cash, excl: cash, inVat: 0, costDeduct: cash, taxDeduct: 0, stampExcl: cash };
            }
        }
        if (smallMode) {
            return {
                cash: raw.cash,
                excl: raw.cash,
                inVat: 0,
                costDeduct: raw.cash,
                taxDeduct: c.ticket === 0 ? 0 : raw.cash,
                stampExcl: raw.stampExcl
            };
        }
        return raw;
    }

    function calcTotals(cfg) {
        let st = cfg.state || state;
        let qty = cfg.qty;
        let pRate = cfg.pRate;
        let surRate = cfg.surRate;
        let incRate = cfg.incRate;
        let stampRate = cfg.stampRate;
        let upRate = cfg.upRate || 0;
        let small = cfg.small != null ? cfg.small : (st.taxpayer === 'small');
        let forceFirst = cfg.forceFirst;

        let cashRev = 0, revExcl = 0, outVat = 0;
        let cashCost = 0, costExcl = 0, taxDeduct = 0, inVat = 0, stampBase = 0;

        st.revs.forEach((r, i) => {
            let s = splitRev(r, qty, (forceFirst && i === 0) ? forceFirst : null);
            cashRev += s.cash;
            revExcl += s.excl;
            outVat += s.outVat;
            if (r.stamp) stampBase += s.excl;
        });
        st.costs.forEach(c => {
            let s = splitCost(c, qty, pRate, upRate, small);
            cashCost += s.cash;
            costExcl += s.costDeduct;
            taxDeduct += s.taxDeduct;
            inVat += s.inVat;
            if (c.stamp) stampBase += s.stampExcl;
        });

        cashRev = dRound(cashRev);
        revExcl = dRound(revExcl);
        outVat = dRound(outVat);
        cashCost = dRound(cashCost);
        costExcl = dRound(costExcl);
        taxDeduct = dRound(taxDeduct);
        inVat = dRound(inVat);
        stampBase = dRound(stampBase);

        let vat = vatSettle(outVat, inVat);
        let unusedVat = vat.unusedVat;
        let payVat = vat.payVat;
        if (unusedVat > 0) {
            taxDeduct = dRound(taxDeduct + unusedVat);
            costExcl = dRound(costExcl + unusedVat);
        }
        let sur = dRound(payVat * surRate);
        let stamp = dRound(stampBase * stampRate);
        let taxableInc = dRound(revExcl - taxDeduct - sur - stamp);
        let incTax = dRound(Math.max(0, taxableInc * incRate));
        let totalTax = dRound(payVat + sur + stamp + incTax);
        let taxAdd = dRound(sur + stamp);
        let otherTax = dRound(taxAdd + incTax);
        let cashMargin = dRound(cashRev - cashCost);
        let netProfit = dRound(cashMargin - totalTax);
        let profitBeforeTax = dRound(revExcl - costExcl - taxAdd);
        let f2Profit = dRound(profitBeforeTax - incTax);
        return {
            cashRev: cashRev, revExcl: revExcl, outVat: outVat,
            cashCost: cashCost, costExcl: costExcl, taxDeduct: taxDeduct, inVat: inVat,
            stampBase: stampBase, unusedVat: unusedVat, payVat: payVat,
            sur: sur, stamp: stamp, taxableInc: taxableInc, incTax: incTax,
            taxAdd: taxAdd, profitBeforeTax: profitBeforeTax,
            totalTax: totalTax, otherTax: otherTax,
            cashMargin: cashMargin, netProfit: netProfit, f2Profit: f2Profit
        };
    }

    function setTaxpayer(mode) {
        if (mode !== 'general' && mode !== 'small') return;
        let prev = state.taxpayer;
        state.taxpayer = mode;
        let upEl = document.getElementById('upstreamRate');
        applyTaxpayerUi();
        if (prev !== mode && upEl) {
            let nowPct = getVal('upstreamRate');
            let rates = defaultRates();
            if (mode === 'small' && nowPct === 9) {
                upEl.value = rates.smallVatPct;
                syncUpstreamRate(rates.smallVatPct);
                return;
            }
            if (mode === 'general' && (nowPct === 1 || nowPct === 3 || nowPct === rates.smallVatPct)) {
                upEl.value = 9;
                syncUpstreamRate(9);
                return;
            }
        }
        buildForms();
        render();
    }

    function applyTaxpayerUi() {
        let g = document.getElementById('btnTaxGeneral');
        let s = document.getElementById('btnTaxSmall');
        if (g && s) {
            g.className = 'btn-toggle ' + (isSmall() ? 'btn-gray' : 'btn-blue');
            s.className = 'btn-toggle ' + (isSmall() ? 'btn-blue' : 'btn-gray');
        }
        let lbl = document.getElementById('lblUpstream');
        if (lbl) {
            lbl.textContent = rateLabel();
            let upTip = isSmall()
                ? '小规模纳税人征收率，用于计算营业收入和应纳税额，常见 1% 或 3%'
                : '向客户开具增值税发票的销项税率；代扣代缴还原进项税额时亦按此税率拆分';
            let upBox = document.getElementById('upstreamRate');
            if (upBox && upBox.closest('.gs-item')) upBox.closest('.gs-item').setAttribute('data-tip', upTip);
        }
        let h1 = document.getElementById('pageTitle');
        if (h1) h1.textContent = '⚙️ 单笔业务成本核算 · ' + taxpayerName();
        document.title = '单笔业务成本核算 0.99版 · ' + taxpayerName();
    }

    function dual(cn, num) {
        return `<span class="f-cn">${cn}</span><span class="f-num">${num}</span>`;
    }

    // 带运算的公式整段放在中文说明下一行；纯数字与说明同一行。等号后的结果不拆行。
    function isFig(s) {
        let t = String(s == null ? '' : s);
        return /[−＋×÷＝]/.test(t) || / [+\-=] /.test(t);
    }

    function escapeAttr(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;');
    }

    function tipAttr(text) {
        return text ? ` data-tip="${escapeAttr(text)}"` : '';
    }

    function chipHtml(kind, title, cnText, numText, value, neg, items) {
        let lineHtml = '';
        if (items && items.length) {
            lineHtml = `<div class="lines">${items.map(it => {
                let fig = isFig(it.num);
                return `<div class="line${fig ? ' is-fig' : ''}"><span class="nm">${it.name}</span><span class="num">${it.num}</span></div>`;
            }).join('')}</div>`;
        }
        // 分项已经写出数字公式时，不再追加一行重复合计；带乘税率的（如印花税）仍保留
        let showNum = numText;
        if (showNum && items && items.length) {
            let compact = String(showNum).replace(/[\s,（）]/g, '');
            let val = String(value).replace(/[\s,]/g, '');
            let hasRate = /[×%‱]/.test(showNum);
            if (!hasRate && (compact === val || compact.endsWith('＝' + val))) {
                showNum = '';
            }
        }
        let dNum = showNum ? `<div class="d-num">${showNum}</div>` : '';
        let tip = cnText ? ` data-tip="${escapeAttr(cnText)}"` : '';
        return `<div class="tax-chip ${kind}"${tip}>
                        <div class="k">${title}</div>
                        ${lineHtml}${dNum}
                        <div class="v${neg ? ' neg' : ''}">${value}</div>
                    </div>`;
    }
    
    function getVal(id) { return parseFloat(document.getElementById(id).value) || 0; }

    function fitNameWidth(el) {
        if (!el) return;
        if (window.innerWidth < 900) {
            el.style.width = '';
            return;
        }
        const minW = 100, maxW = 240;
        if (!fitNameWidth.ctx) {
            fitNameWidth.canvas = document.createElement('canvas');
            fitNameWidth.ctx = fitNameWidth.canvas.getContext('2d');
        }
        const cs = window.getComputedStyle(el);
        fitNameWidth.ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const w = Math.ceil(fitNameWidth.ctx.measureText(el.value || ' ').width) + 20;
        el.style.width = Math.min(maxW, Math.max(minW, w)) + 'px';
    }

    // 界面用百分数，内部计算用小数
    function toPct(rate) { return parseFloat(((parseFloat(rate) || 0) * 100).toFixed(4)); }
    function fromPct(val) { return (parseFloat(val) || 0) / 100; }
    function getRate(id) { return fromPct(getVal(id)); }
    // 印花输入用万分（1.5 = 1.5‱），内部计算用小数
    function getStampRate() { return (getVal('stampRate') || 0) / 10000; }
    function stampPermyriad(rate) {
        let n = Math.round((parseFloat(rate) || 0) * 10000 * 10) / 10;
        return n.toFixed(1).replace(/\.0$/, '');
    }
    // 财务数字：千分位 + 两位小数
    function fmtMoney(n) {
        let x = dRound(n);
        let sign = x < 0 ? '-' : '';
        let parts = Math.abs(x).toFixed(2).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return sign + parts[0] + '.' + parts[1];
    }
    function fmtInt(n) {
        let x = Math.round(parseFloat(n) || 0);
        let sign = x < 0 ? '-' : '';
        return sign + String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }
    // 数字公式：两位小数、不带千分位，避免逗号歧义
    function fmtFig(n) {
        return dRound(n).toFixed(2);
    }

    function getQty() {
        let el = document.getElementById('qty');
        if (!el || el.value === '' || el.value === null) return 1;
        let n = parseFloat(el.value);
        if (isNaN(n) || n < 0) return 1;
        return n;
    }
    
    function syncUpstreamRate(val) {
        let rate = fromPct(val);
        // 只同步第一项开票收入；不开票项税率必须保持 0，否则会误计销项
        if (state.revs.length > 0 && state.revs[0].inc) { state.revs[0].rate = rate; }
        buildForms(); render();
    }

    function syncPlatRate(val) {
        let rate = fromPct(val);
        state.costs.forEach(c => {
            if (c.ticket === 3) {
                c.rate = rate;
            }
        });
        buildForms(); render();
    }

    function updateVal(type, id, field, val) {
        let arr = type === 'rev' ? state.revs : state.costs;
        let item = arr.find(x => x.id === id);
        if (field === 'name') {
            item[field] = val;
            if (document.activeElement && document.activeElement.classList.contains('name-input')) {
                fitNameWidth(document.activeElement);
            }
        } else if (field === 'rate') {
            item.rate = fromPct(val);
            if (type === 'rev' && state.revs.length > 0 && id === state.revs[0].id) {
                document.getElementById('upstreamRate').value = toPct(item.rate);
            }
        } else {
            item[field] = parseFloat(val) || 0;
        }
        render();
    }

    function restoreWithholdingTicket(c) {
        c.ticket = (c.prevTicket === 0 || c.prevTicket === 1 || c.prevTicket === 2) ? c.prevTicket : 2;
        c.rate = (typeof c.prevRate === 'number') ? c.prevRate : (c.ticket === 2 ? 0.01 : (c.ticket === 1 ? 0.01 : 0));
        delete c.prevTicket;
        delete c.prevRate;
    }

    function applyFirstCostWithholding() {
        if (!state.costs.length) return;
        let c = state.costs[0];
        if (c.ticket === 3) {
            c.rate = getRate('platRate') || 0.075;
            return;
        }
        c.prevTicket = c.ticket;
        c.prevRate = c.rate;
        c.ticket = 3;
        c.rate = getRate('platRate') || 0.075;
    }

    function togglePlatform() {
        state.usePlatform = !state.usePlatform;
        const btn = document.getElementById('btnPlatform');
        const wrap = document.getElementById('wrapPlatRate');
        
        if (state.usePlatform) {
            btn.className = 'btn-toggle btn-purple';
            btn.innerHTML = '已开启 代扣代缴';
            btn.setAttribute('data-tip', '已开启：第一项成本已设为代扣代缴，税率与上方代扣税率一致。金额栏填承运人净额。关闭开关后恢复原票种');
            wrap.style.display = 'flex';
            applyFirstCostWithholding();
        } else {
            btn.className = 'btn-toggle btn-gray';
            btn.innerHTML = '已关闭 代扣代缴';
            btn.setAttribute('data-tip', '开启后，第一项成本自动设为代扣代缴并带出代扣税率；金额栏填承运人净额。关闭后恢复原票种');
            wrap.style.display = 'none';
            state.costs.forEach(c => {
                if (c.ticket !== 3) return;
                restoreWithholdingTicket(c);
            });
        }
        buildForms();
        render();
    }

    function toggleRevInc(id) {
        let r = state.revs.find(x => x.id === id);
        r.inc = !r.inc;
        r.rate = r.inc ? getRate('upstreamRate') : 0;
        buildForms(); render();
    }
    
    function toggleStamp(type, id) {
        let arr = type === 'rev' ? state.revs : state.costs;
        let item = arr.find(x => x.id === id);
        item.stamp = !item.stamp;
        buildForms(); render();
    }

    function toggleCostTicket(id) {
        let c = state.costs.find(x => x.id === id);
        if (!c) return;
        if (c.ticket === 3) {
            if (state.usePlatform) {
                alert('请先关闭上方「代扣代缴」开关，才能改为其他票种。');
                return;
            }
            restoreWithholdingTicket(c);
            buildForms(); render();
            return;
        }
        let maxState = state.usePlatform ? 4 : 3;
        let prevTicket = c.ticket;
        let prevRate = c.rate;
        c.ticket = (c.ticket + 1) % maxState;
        if (c.ticket === 3) {
            c.prevTicket = prevTicket;
            c.prevRate = prevRate;
            c.rate = getRate('platRate') || 0.075;
        } else if (c.ticket === 0) {
            c.rate = 0;
        } else if (c.ticket === 1) {
            c.rate = 0.01;
        } else if (c.ticket === 2) {
            c.rate = (typeof prevRate === 'number' && prevTicket === 2) ? prevRate : 0.01;
        }
        
        buildForms(); render();
    }

    function addRevRow() {
        let upRate = getRate('upstreamRate') || 0.09;
        state.revs.push({ id: state.nextId++, name: "新增收入", amt: 0, rate: upRate, inc: true, stamp: true });
        buildForms(); render();
    }
    
    function addCostRow() {
        state.costs.push({ id: state.nextId++, name: "新增成本", amt: 0, rate: 0.01, ticket: 1, stamp: true });
        buildForms(); render();
    }
    
    function delRow(type, id) {
        if(type === 'rev') state.revs = state.revs.filter(x => x.id !== id);
        else state.costs = state.costs.filter(x => x.id !== id);
        buildForms(); render();
    }

    function reverseCalcCost(id) {
        let c = state.costs.find(x => x.id === id);
        if (!c) return;
        if (c.ticket === 3) {
            let pRate = getRate('platRate');
            let upRate = getRate('upstreamRate');
            let raw = prompt(`【代扣代缴倒推】\n当前成本项目：${c.name}\n\n请输入承运人【净额】：`, c.amt);
            if (raw === null || raw === '' || isNaN(raw)) return;
            let net = parseFloat(raw);
            if (pRate < 0 || pRate >= 1) {
                alert('代扣税率必须在 0 到 1 之间');
                return;
            }
            let gross = dRound(net / (1 - pRate));
            let excl = vatSplit(gross, upRate).excl;
            if (confirm(`净额 ${fmtMoney(dRound(net))} 元\n价税合计 ${fmtMoney(gross)} ＝ 净额 ÷（1 − 代扣税率 ${(pRate*100).toFixed(2)}%）\n按销项税率 ${(upRate*100).toFixed(0)}% 计算进项税额，营业收入 ${fmtMoney(excl)} 元\n\n金额栏填入净额 ${fmtMoney(dRound(net))} 元？`)) {
                updateVal('cost', id, 'amt', dRound(net));
                buildForms();
            }
            return;
        }
        let raw = prompt(`【倒推价税合计】\n当前成本项目：${c.name}\n\n请输入不含税金额，系统按该项税率还原价税合计：`, c.amt);
        if (raw === null || raw === '' || isNaN(raw)) return;
        let excl = parseFloat(raw);
        let rate = c.ticket === 0 ? 0 : (c.rate || 0);
        let gross = rate > 0 ? dRound(excl * (1 + rate)) : dRound(excl);
        if (confirm(`不含税 ${fmtMoney(dRound(excl))} 元\n价税合计 ${fmtMoney(gross)} ＝ 不含税 ×（1＋税率 ${(rate*100).toFixed(0)}%）\n\n是否填入价税合计？`)) {
            updateVal('cost', id, 'amt', gross);
            buildForms();
        }
    }

    function getBreakevenRev() {
        let qty = getQty();
        let rates = {
            state: state,
            qty: qty,
            pRate: getRate('platRate'),
            surRate: getRate('surchargeRate'),
            incRate: getRate('incomeRate'),
            stampRate: getStampRate(),
            upRate: getRate('upstreamRate') || 0,
            small: isSmall()
        };
        let upRate = rates.upRate;
        if (!state.revs.length) return { noInvoice: 0, withInvoice: 0, rate: upRate };
        let probe = calcTotals(rates);
        if (probe.cashCost === 0 && state.revs.slice(1).every(r => r.amt === 0)) {
            return { noInvoice: 0, withInvoice: 0, rate: upRate };
        }

        function trial(R, invoiceRate) {
            return calcTotals(Object.assign({}, rates, {
                forceFirst: { cash: R, inc: invoiceRate > 0, rate: invoiceRate }
            }));
        }

        function findMinRev(invoiceRate) {
            let lowCents = 0;
            let highCents = Math.max(100, Math.ceil((probe.cashCost + 1) * 400));
            let tHigh = trial(highCents / 100, invoiceRate);
            while (tHigh.netProfit < 0 && highCents < 1e12) {
                highCents = highCents * 2;
                tHigh = trial(highCents / 100, invoiceRate);
            }
            if (tHigh.netProfit < 0) return highCents / 100;
            let bestCents = highCents;
            while (lowCents <= highCents) {
                let midCents = Math.floor((lowCents + highCents) / 2);
                if (trial(midCents / 100, invoiceRate).netProfit >= 0) {
                    bestCents = midCents;
                    highCents = midCents - 1;
                } else {
                    lowCents = midCents + 1;
                }
            }
            return bestCents / 100;
        }

        return {
            noInvoice: findMinRev(0),
            withInvoice: findMinRev(upRate),
            rate: upRate
        };
    }

    function showBreakeven(e) {
        if (e) e.stopPropagation();
        hideAppTip();
        closeGuide();
        if (state.revs.length === 0) {
            alert('请先添加一项收入，再进行保本测算');
            return;
        }
        let res = getBreakevenRev();
        let invExcl = res.rate > 0 ? dRound(res.withInvoice / (1 + res.rate)) : res.withInvoice;
        let qty = getQty();
        let qtyNote = '';
        if (qty > 0 && qty !== 1) {
            qtyNote = `<div class="be-sub">以上为 ${fmtInt(qty)} 倍合计 · 单价不开票 ${fmtMoney(dRound(res.noInvoice / qty))} / 开票价税合计 ${fmtMoney(dRound(res.withInvoice / qty))}</div>`;
        } else if (qty === 0) {
            qtyNote = `<div class="be-sub">业务数量为 0，不测算单价</div>`;
        }
        let extra = state.revs.length > 1 ? `<div class="be-sub">按第一项收入测算保本，其余 ${state.revs.length - 1} 项收入已计入</div>` : '';
        let tNo = calcTotals(Object.assign({}, {
            qty: qty, pRate: getRate('platRate'), surRate: getRate('surchargeRate'),
            incRate: getRate('incomeRate'), stampRate: getStampRate(),
            upRate: getRate('upstreamRate') || 0, small: isSmall(),
            forceFirst: { cash: res.noInvoice, inc: false, rate: 0 }
        }));
        let tInv = calcTotals(Object.assign({}, {
            qty: qty, pRate: getRate('platRate'), surRate: getRate('surchargeRate'),
            incRate: getRate('incomeRate'), stampRate: getStampRate(),
            upRate: getRate('upstreamRate') || 0, small: isSmall(),
            forceFirst: { cash: res.withInvoice, inc: true, rate: res.rate }
        }));
        let ratePct = (res.rate * 100).toFixed(2).replace(/\.00$/, '');
        let box = document.getElementById('beBody');
        if (box) {
            box.innerHTML = `<div class="be-row">不开票应收金额 <b>${fmtMoney(res.noInvoice)}</b> 元</div>`
                + `<div class="be-sub">此时现金净额 ${fmtMoney(tNo.netProfit)} 元；再低 0.01 元则现金净额为负</div>`
                + `<div class="be-row">开票价税合计 <b>${fmtMoney(res.withInvoice)}</b> 元</div>`
                + `<div class="be-sub">营业收入 ${fmtMoney(invExcl)} 元</div>`
                + `<div class="be-sub">＝ 价税合计 ÷（1＋${rateLabel()} ${ratePct}%）</div>`
                + `<div class="be-sub">此时现金净额 ${fmtMoney(tInv.netProfit)} 元；再低 0.01 元则现金净额为负</div>`
                + qtyNote + extra;
        }
        let mask = document.getElementById('beMask');
        if (mask) mask.classList.add('show');
    }

    function buildForms() {

            let incText = r.inc ? "开票" : "不开票";

                <div class="list-row">

    function render() {
        let qty = getQty();
        let pRate = getRate('platRate');
        let surRate = getRate('surchargeRate');
        let incRate = getRate('incomeRate');
        let stampRate = getStampRate();
        let upRate = getRate('upstreamRate');

        let totals = {
            cashRev: 0, revExcl: 0, outVat: 0,
            cashCost: 0, costExcl: 0, taxDeduct: 0, inVat: 0,
            stampBase: 0,
            revsHtml: '', revExclHtml: '',
            costHtml: '', costExclHtml: '',
            revCashNums: [], revExclNums: [], costCashNums: [], costExclNums: [],
            revExclItems: [], outVatItems: [], costExclItems: [], inVatItems: [],
            stampItems: [], taxDeductItems: []
        };

        state.revs.forEach(r => {
            let s = splitRev(r, qty);
            let cash = s.cash, excl = s.excl, outVat = s.outVat;
            totals.cashRev += cash;
            totals.revExcl += excl;
            totals.outVat += outVat;
            if(r.stamp) {
                totals.stampBase += excl;
                totals.stampItems.push({ name: r.name + '计税依据', num: fmtFig(excl) });
            }

            totals.revCashNums.push(fmtMoney(cash));
            totals.revExclNums.push(fmtFig(excl));
            totals.revExclItems.push(r.inc && r.rate > 0
                ? { name: r.name + '营业收入', num: `${fmtFig(cash)} ÷ ${(1 + r.rate).toFixed(2)} ＝ ${fmtFig(excl)}` }
                : { name: r.name + (r.inc ? '营业收入' : '实收'), num: fmtFig(cash) });
            totals.outVatItems.push(r.rate > 0
                ? { name: r.name + (isSmall() ? '应纳税额' : '销项税额'), num: `${fmtFig(cash)} − ${fmtFig(excl)} ＝ ${fmtFig(outVat)}` }
                : { name: r.name + (isSmall() ? '应纳税额' : '销项税额'), num: fmtFig(0) });

            totals.revsHtml += `
                <div class="row-item sub-row"${tipAttr(r.inc
                    ? '价税合计流入 = 单价 × 数量。本栏按开票实收，不拆增值税。'
                    : '实收 = 单价 × 数量。不开票不计提销项税额，流入等于实收。')}>
                    <span class="row-label">📥 ${r.name}</span>
                    <span class="row-detail">${r.inc ? '价税合计（开票）' : '实收（不开票）'}</span>

            totals.revExclHtml += `

        state.costs.forEach(c => {

                if(c.ticket === 2) {
                    ticketStr = "专用发票（价税合计）";

                    ticketStr = "无票（价税合计）";

                totals.costHtml += `
                    <div class="row-item sub-row"${tipAttr('价税合计流出 = 单价 × 数量。现金收付不区分进项能否抵扣，按实付列示。')}>

            totals.cashCost += cash;
            totals.costExcl += costDeduct;
            totals.inVat += inVat;
            totals.taxDeduct += taxDeduct;
            if(c.stamp) {

            let costCn, costNum;

                costCn = '价税合计 ÷（1＋销项税率）';

        totals.cashRev = dRound(totals.cashRev); totals.revExcl = dRound(totals.revExcl); totals.outVat = dRound(totals.outVat);

        let deductChip = deductDiffers
            ? chipHtml('base', '税前扣除', '企业所得税税前扣除 = 专用发票按不含税金额 ＋ 普通发票按价税合计；无票不得扣除', totals.taxDeductItems.map(it => it.num).join(' ＋ ') + ` ＝ ${fmtFig(totals.taxDeduct)}`, fmtMoney(totals.taxDeduct), false, totals.taxDeductItems)
            : '';
        let revExclJoin = totals.revExclNums.join(' ＋ ') + (totals.revExclNums.length > 1 ? ` ＝ ${fmtFig(totals.revExcl)}` : '');
        let costExclJoin = totals.costExclNums.join(' ＋ ') + (totals.costExclNums.length > 1 ? ` ＝ ${fmtFig(totals.costExcl)}` : '');

                        ${unusedChip}
                        ${chipHtml('tax', '附加税费', '附加税费 = 应交增值税 × 附加税费率', `${fmtFig(payVat)} × ${(surRate * 100).toFixed(0)}% ＝ ${fmtFig(sur)}`, fmtMoney(sur), true)}
                        ${chipHtml('tax', '印花税', '印花税 = 勾选项目计税依据合计 × 印花税率', stampNum, fmtMoney(stamp), true, totals.stampItems)}
                        ${chipHtml('tax', '所得税费用', incCn, incNum, fmtMoney(incTax), true)}

        let reportHtml = `

                                <span class="row-value sub-val">${fmtMoney(payVat)}</span>

                        <div class="block-tax">

                            <div class="row-item row-total"${tipAttr('所得税费用合计 = 企业所得税。应纳税所得额为负时为 0。')}>

                        <div class="block-result">
                            <div class="block-label"${tipAttr('现金净额应与右侧净利润勾稽一致。')}>📊 结果</div>
                            <div class="row-item sub-row"${tipAttr('收付差额 = 价税合计流入 − 价税合计流出（尚未扣税）')}>
                                <span class="row-label">收付差额</span>
                                <span class="row-detail">${dual('价税合计流入 − 价税合计流出', cashMarginNum)}</span>
                                <span class="row-value sub-val">${cashMargin>=0?'+':''}${fmtMoney(cashMargin)}</span>
                            </div>
                            <div class="row-item row-total" style="border-bottom: none;"${tipAttr('现金净额 = 收付差额 − 应交增值税 − 税金及附加 − 所得税费用。应与右侧净利润一致。')}>
                                <span class="row-label">① 现金净额</span>
                                <span class="row-detail">${dual('收付差额 − 应交增值税 − 税金及附加 − 所得税费用', cashProfitNum)}</span>
                                <span class="row-value big ${netProfit>=0?'green':'negative'}">${netProfit>=0?'+':''}${fmtMoney(netProfit)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="panel panel-tax">
                        <div class="panel-title"${tipAttr('按会计准则列示：收入、成本用不含税金额；税金及附加与所得税费用分列；增值税不进利润表。')}>🧾 利润表 <span class="badge">不含税口径</span></div>
                        <div class="block-positive">
                            <div class="block-label"${tipAttr('确认的营业收入。开票：价税合计 ÷（1＋销项税率或征收率）；不开票：等于实收。')}>⬆ 营业收入</div>
                            ${totals.revExclHtml}
                            <div class="row-item row-total"${tipAttr('营业收入合计 = 各项营业收入相加')}>
                                <span class="row-label">营业收入合计</span>
                                <span class="row-detail">${dual('各项营业收入相加', revExclNum)}</span>
                                <span class="row-value positive">${fmtMoney(totals.revExcl)}</span>
                            </div>
                        </div>
                        <div class="block-negative">
                            <div class="block-label"${tipAttr('专用发票、代扣按不含税金额；普通发票、无票按价税合计；本单未抵完进项计入营业成本。')}>⬇ 营业成本</div>
                            ${totals.costExclHtml}
                            <div class="row-item row-total"${tipAttr('营业成本合计 = 各项营业成本相加')}>
                                <span class="row-label">营业成本合计</span><span class="row-detail">${dual('各项营业成本相加', costExclNum)}</span><span class="row-value negative">−${fmtMoney(totals.costExcl)}</span>
                            </div>
                        </div>
                        <div class="block-tax">
                            <div class="block-label"${tipAttr('税金及附加含城市维护建设税、教育费附加、地方教育附加及印花税。增值税是价外税，不进利润表。')}>⬇ 税金及附加</div>
                            <div class="row-item sub-row"${tipAttr('附加税费 = 应交增值税 × 附加税费率，含城市维护建设税、教育费附加、地方教育附加。')}>
                                <span class="row-label">附加税费</span>
                                <span class="row-detail">${dual('应交增值税 × 附加税费率', surNum)}</span>
                                <span class="row-value sub-val">${fmtMoney(sur)}</span>
                            </div>
                            <div class="row-item sub-row"${tipAttr('印花税列入税金及附加。= 勾选项目计税依据合计 × 印花税率。居间合同不征。')}>
                                <span class="row-label">印花税</span>
                                <span class="row-detail">${dual('计税依据 × 印花税率', stampNum)}</span>
                                <span class="row-value sub-val">${fmtMoney(stamp)}</span>
                            </div>
                            <div class="row-item row-total"${tipAttr('税金及附加 = 附加税费 ＋ 印花税。不含增值税，不含所得税费用。')}>
                                <span class="row-label">税金及附加合计</span>
                                <span class="row-detail">${dual('附加税费 ＋ 印花税', taxAddNum)}</span>
                                <span class="row-value total-tax">−${fmtMoney(taxAdd)}</span>
                            </div>
                        </div>
                        <div class="block-tax">
                            <div class="block-label"${tipAttr('所得税费用为计提的企业所得税，单独列示，不并入税金及附加。')}>⬇ 所得税费用</div>
                            <div class="row-item sub-row"${tipAttr(incCn)}>
                                <span class="row-label">企业所得税</span>
                                <span class="row-detail">${dual('应纳税所得额 × 企业所得税率', incNum)}</span>
                                <span class="row-value sub-val">${fmtMoney(incTax)}</span>
                            </div>
                            <div class="row-item row-total"${tipAttr('所得税费用合计 = 企业所得税。应纳税所得额为负时为 0。')}>
                                <span class="row-label">所得税费用合计</span>
                                <span class="row-detail">${dual('企业所得税', fmtFig(incTax))}</span>
                                <span class="row-value total-tax">−${fmtMoney(incTax)}</span>
                            </div>
                        </div>
                        <div class="block-result">
                            <div class="block-label"${tipAttr('先算利润总额，再减所得税费用得到净利润。应与左侧现金净额勾稽一致。')}>📊 结果</div>
                            <div class="row-item sub-row"${tipAttr('利润总额 = 营业收入合计 − 营业成本合计 − 税金及附加。本单无期间费用、营业外收支。')}>
                                <span class="row-label">利润总额</span>
                                <span class="row-detail">${dual('营业收入合计 − 营业成本合计 − 税金及附加', profitBeforeTaxNum)}</span>
                                <span class="row-value sub-val">${profitBeforeTax>=0?'+':''}${fmtMoney(profitBeforeTax)}</span>
                            </div>
                            <div class="row-item row-total" style="border-bottom: none;"${tipAttr('净利润 = 利润总额 − 所得税费用。应与左侧现金净额一致。增值税已从收入成本中剔除，不在本式出现。')}>
                                <span class="row-label">② 净利润</span>
                                <span class="row-detail">${dual('利润总额 − 所得税费用', pnlProfitNum)}</span>
                                <span class="row-value big ${f2Profit>=0?'green':'negative'}">${f2Profit>=0?'+':''}${fmtMoney(f2Profit)}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="result-area"${tipAttr('勾稽关系：现金净额 = 净利润。左边扣应交增值税，右边收入成本已剔除增值税，两边结果应一致。')}>
                    <div class="result-item">
                        <span class="label">✅ 交叉验证</span>
                        <span class="number ${netProfit>=0?'green':'red'}">${fmtMoney(netProfit)}</span>
                        <span style="color:#2a4f77; font-weight:500;">= ${fmtMoney(f2Profit)}</span>
                        <span class="check-mark ${Math.abs(netProfit - f2Profit)<0.01 ? 'success':'error'}">${Math.abs(netProfit - f2Profit)<0.01 ? '✔ 现金净额与净利润一致':'❌ 两项金额不一致'}</span>
                    </div>
                </div>
                <div class="footnote">
                    <span data-tip="开票为价税合计，不开票为实收">📌 价税合计流入 ${fmtMoney(totals.cashRev)}</span>
                    <span data-tip="营业收入 = 价税合计 ÷（1＋销项税率或征收率）；不开票时等于实收">📌 营业收入 ${fmtMoney(totals.revExcl)}</span>
                    <span data-tip="成本付现：开票为价税合计，代扣为还原后的价税合计">📌 价税合计流出 ${fmtMoney(totals.cashCost)}</span>
                    <span data-tip="专用发票、代扣按不含税金额；普通发票、无票按价税合计；本单未抵完进项计入营业成本">📌 营业成本 ${fmtMoney(totals.costExcl)}</span>
                    <span data-tip="应交增值税 ＋ 税金及附加 ＋ 所得税费用">📌 税费合计 ${fmtMoney(totalTax)}</span>
                    <span data-tip="增值税税负 = 应交增值税 ÷ 营业收入。税务风险分析常用此口径">📊 增值税税负 ${vatBurden}${vatBurden === '—' ? '' : '%'}</span>
                    <span data-tip="实际税负 = 税费合计 ÷ 营业收入。分母不用价税合计，否则会低估税负">📊 实际税负 ${realBurden}${realBurden === '—' ? '' : '%'}</span>
                </div>
            </div>`;
        document.getElementById('reportView').innerHTML = reportHtml;
    }

    let tipTimer = null;
    let tipAnchor = null;
    let tipXY = { x: 0, y: 0 };

    function hideAppTip() {
        let el = document.getElementById('appTip');
        if (el) el.style.opacity = '0';
        tipAnchor = null;
        if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
    }

    function placeAppTip(el) {
        let tw = el.offsetWidth;
        let th = el.offsetHeight;
        let left = tipXY.x + 14;
        let top = tipXY.y - th - 12;
        if (top < 8) top = tipXY.y + 16;
        if (left + tw > window.innerWidth - 8) left = tipXY.x - tw - 14;
        if (left < 8) left = 8;
        if (top + th > window.innerHeight - 8) top = Math.max(8, window.innerHeight - th - 8);
        el.style.left = left + 'px';
        el.style.top = top + 'px';
    }

    function showAppTip(anchor, e) {
        let text = anchor.getAttribute('data-tip');
        if (!text) return;
        if (e) {
            tipXY.x = e.clientX;
            tipXY.y = e.clientY;
        }
        if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
        tipAnchor = anchor;
        let el = document.getElementById('appTip');
        if (!el) {
            el = document.createElement('div');
            el.id = 'appTip';
            document.body.appendChild(el);
        }
        el.textContent = text;
        el.style.opacity = '1';
        el.style.left = '-999px';
        el.style.top = '0';
        requestAnimationFrame(function () { placeAppTip(el); });
        tipTimer = setTimeout(hideAppTip, 5000);
    }

    document.addEventListener('click', function (e) {
        if (!window.matchMedia('(hover: none), (max-width: 900px)').matches) return;
        let t = e.target.closest('.tax-chip[data-tip], .gs-item[data-tip], .footnote [data-tip], .panel [data-tip], .result-area[data-tip]');
        if (!t) return;
        if (e.target.closest('input, button')) return;
        showAppTip(t, e);
    });
    document.addEventListener('mouseover', function (e) {
        let t = e.target.closest('[data-tip]');
        if (!t || t === tipAnchor) return;
        showAppTip(t, e);
    });
    document.addEventListener('mousemove', function (e) {
        tipXY.x = e.clientX;
        tipXY.y = e.clientY;
        if (!tipAnchor) return;
        if (e.target.closest('[data-tip]') !== tipAnchor) return;
        let el = document.getElementById('appTip');
        if (el && el.style.opacity !== '0') placeAppTip(el);
    });
    document.addEventListener('mouseout', function (e) {
        let t = e.target.closest('[data-tip]');
        if (!t || t !== tipAnchor) return;
        if (e.relatedTarget && t.contains(e.relatedTarget)) return;
        hideAppTip();
    });
    document.addEventListener('scroll', hideAppTip, true);
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeGuide();
            closeBreakeven();
        }
    });

    applyPolicyDefaults();
    applyTaxpayerUi();
    buildForms();
    render();
</script>
</body>
</html>
